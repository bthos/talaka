<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Talaka Dashboard</title>
<style>
/* Layout: fixed left rail + top bar; each view is its own work area; one shared detail drawer slides in from the right.
   Mockup constraints mirror the real build: one file, no fonts or libraries to fetch, hand-made SVG. */
:root{
  --bg:#f3f5f6; --panel:#ffffff; --panel-2:#edf0f2; --ink:#11171b; --ink-2:#46515a; --muted:#727d87;
  --line:#dce1e5; --line-2:#c6ced4; --grid:#e7eaed;
  --accent:#0d6880; --accent-ink:#ffffff; --accent-soft:#d9ecf1;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#e87ba4; --s6:#4a3aa7; --s7:#e34948;
  --good:#0ca30c; --warn:#fab219; --serious:#ec835a; --crit:#d03b3b;
  --good-ink:#006300; --warn-ink:#875800; --crit-ink:#b02a2a;
  --shadow:0 1px 2px rgba(15,25,32,.06),0 10px 28px rgba(15,25,32,.10);
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,"SF Mono","Cascadia Mono","JetBrains Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0d1012; --panel:#15191c; --panel-2:#1c2125; --ink:#e8ecef; --ink-2:#b2bbc2; --muted:#86909a;
  --line:#252b30; --line-2:#353c42; --grid:#20262a;
  --accent:#5cb6d1; --accent-ink:#04212a; --accent-soft:#143440;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#9085e9; --s7:#e66767;
  --good-ink:#3fc33f; --warn-ink:#f2bf4a; --crit-ink:#f07b7b;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 32px rgba(0,0,0,.45); color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0d1012; --panel:#15191c; --panel-2:#1c2125; --ink:#e8ecef; --ink-2:#b2bbc2; --muted:#86909a;
  --line:#252b30; --line-2:#353c42; --grid:#20262a;
  --accent:#5cb6d1; --accent-ink:#04212a; --accent-soft:#143440;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#9085e9; --s7:#e66767;
  --good-ink:#3fc33f; --warn-ink:#f2bf4a; --crit-ink:#f07b7b;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 32px rgba(0,0,0,.45); color-scheme:dark;}

html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:14px/1.45 var(--sans);overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--mono);font-size:12.5px}
.muted{color:var(--muted)} .ink2{color:var(--ink-2)}
.num{font-variant-numeric:tabular-nums}

.app{display:grid;grid-template-columns:212px minmax(0,1fr);grid-template-rows:52px minmax(0,1fr);height:100%}
.rail{grid-row:1/3;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:14px 10px;gap:2px;min-height:0}
.brand{display:flex;align-items:center;gap:10px;padding:2px 8px 16px}
.brand svg{flex:none}
.brand b{font-size:15px;letter-spacing:.14em;text-transform:uppercase}
.brand small{display:block;color:var(--muted);font-size:11px;letter-spacing:.02em;margin-top:-2px}
.nav{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:7px;color:var(--ink-2);text-decoration:none;white-space:nowrap}
.nav:hover{background:var(--panel-2);color:var(--ink)}
.nav.on{background:var(--accent-soft);color:var(--ink);font-weight:600}
.nav svg{width:17px;height:17px;flex:none;stroke:currentColor;fill:none;stroke-width:1.6}
.nav .ct{margin-left:auto;font-size:11px;font-weight:600;background:var(--crit);color:#fff;border-radius:9px;padding:0 6px;line-height:17px}
.rail .foot{margin-top:auto;padding:10px;font-size:11.5px;color:var(--muted);border-top:1px solid var(--line)}

.top{display:flex;align-items:center;gap:10px;padding:0 16px;border-bottom:1px solid var(--line);background:var(--panel);min-width:0}
.search{display:flex;align-items:center;gap:8px;flex:1;max-width:460px;height:32px;padding:0 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--muted);min-width:0}
.search span{flex:1;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
kbd{font-family:var(--mono);font-size:11px;border:1px solid var(--line-2);border-bottom-width:2px;border-radius:4px;padding:0 5px;color:var(--ink-2)}
.tbtn{height:32px;padding:0 10px;border:1px solid var(--line);border-radius:8px;display:flex;align-items:center;gap:7px;color:var(--ink-2);white-space:nowrap}
.tbtn:hover{border-color:var(--line-2);color:var(--ink)}
.src .dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.src.live .dot{background:var(--good);box-shadow:0 0 0 0 var(--good);animation:pulse 1.8s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(12,163,12,.5)}70%{box-shadow:0 0 0 7px rgba(12,163,12,0)}100%{box-shadow:0 0 0 0 rgba(12,163,12,0)}}
@media (prefers-reduced-motion: reduce){.src.live .dot{animation:none}}
.spacer{flex:1}

.main{overflow:auto;min-width:0;min-height:0;position:relative}
.wrap{padding:22px 24px 48px;max-width:1440px}
.main.full{overflow:hidden}
h1{font-size:21px;font-weight:650;letter-spacing:-.01em;margin:0;text-wrap:balance}
h2{font-size:13px;font-weight:650;margin:0;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2)}
h3{font-size:15px;font-weight:650;margin:0}
.head{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap;margin-bottom:18px}
.head p{margin:2px 0 0;color:var(--muted)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;min-width:0}
.ph{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line)}
.ph .r{margin-left:auto;display:flex;gap:8px;align-items:center}
.pb{padding:14px}
.grid{display:grid;gap:14px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;padding:2px;background:var(--panel)}
.seg button{padding:4px 11px;border-radius:6px;color:var(--ink-2);font-size:13px}
.seg button.on{background:var(--accent);color:var(--accent-ink)}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;padding:1px 8px;border-radius:999px;border:1px solid var(--line);color:var(--ink-2);white-space:nowrap;background:var(--panel)}
.chip.link{cursor:pointer}.chip.link:hover{border-color:var(--accent);color:var(--ink)}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:650;padding:1px 7px;border-radius:5px;white-space:nowrap;letter-spacing:.01em}
.b-crit{background:color-mix(in srgb,var(--crit) 14%,transparent);color:var(--crit-ink)}
.b-warn{background:color-mix(in srgb,var(--warn) 22%,transparent);color:var(--warn-ink)}
.b-good{background:color-mix(in srgb,var(--good) 15%,transparent);color:var(--good-ink)}
.b-info{background:var(--panel-2);color:var(--ink-2)}

/* worker identity: monogram disc + name, same everywhere */
.ag{display:inline-flex;align-items:center;gap:6px;white-space:nowrap;font-size:13px}
.ag b{width:18px;height:18px;border-radius:50%;background:var(--c);color:#fff;font:700 10.5px/18px var(--sans);text-align:center;flex:none}
.ag.sm b{width:15px;height:15px;font-size:9px;line-height:15px}

/* KPI */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:14px}
.kpi{padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.kpi .l{font-size:12px;color:var(--muted);letter-spacing:.03em}
.kpi .v{font-size:26px;font-weight:650;letter-spacing:-.02em;line-height:1.1}
.kpi .s{font-size:12.5px;color:var(--ink-2)}
.meter{display:grid;grid-template-columns:24px 1fr 38px;align-items:center;gap:8px;font-size:12px}
.mbar{position:relative;height:8px;border-radius:4px;background:var(--panel-2);overflow:visible}
.mbar i{position:absolute;inset:0 auto 0 0;border-radius:4px;background:var(--accent)}
.mbar u{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink);border-radius:1px}

/* inbox */
.inbox{display:flex;flex-direction:column}
.ib{display:grid;grid-template-columns:28px minmax(0,1fr);gap:10px;padding:12px 14px;border-bottom:1px solid var(--line)}
.ib:last-child{border-bottom:0}
.ib .ic{width:26px;height:26px;border-radius:7px;display:grid;place-items:center;font-size:13px;font-weight:700}
.ib .t{font-weight:600;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.ib .t a{color:inherit;text-decoration:none;cursor:pointer}.ib .t a:hover{text-decoration:underline}
.ib p{margin:3px 0 8px;color:var(--ink-2);font-size:13px}
.cmd{display:flex;align-items:center;gap:0;border:1px solid var(--line);border-radius:7px;background:var(--bg);max-width:100%;min-width:0}
.cmd code{font-family:var(--mono);font-size:12px;padding:5px 9px;overflow-x:auto;white-space:nowrap;flex:1;min-width:0}
.cmd button{border-left:1px solid var(--line);padding:5px 10px;font-size:12px;color:var(--ink-2);white-space:nowrap}
.cmd button:hover{color:var(--ink);background:var(--panel-2)}

/* feed */
.feed{display:flex;flex-direction:column}
.fe{display:grid;grid-template-columns:52px minmax(0,1fr);gap:10px;padding:9px 14px;border-bottom:1px solid var(--line);cursor:pointer}
.fe:hover{background:var(--panel-2)}
.fe:last-child{border-bottom:0}
.fe .tm{font-size:12px;color:var(--muted);padding-top:1px}
.fe .ln{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:13px}
.fe .rs{font-size:12.5px;color:var(--ink-2);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fe.prog .rs{color:var(--muted)}

/* board */
.board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(212px,1fr);gap:10px;overflow-x:auto;padding-bottom:6px}
.col{background:var(--panel-2);border-radius:10px;padding:8px;display:flex;flex-direction:column;gap:8px;min-height:180px}
.col h4{margin:2px 4px 2px;font-size:12px;font-weight:650;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-2);display:flex;gap:6px;align-items:center}
.col h4 .n{color:var(--muted);font-weight:500}
.col.arch{opacity:.92}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px;cursor:pointer;display:flex;flex-direction:column;gap:7px;text-align:left;width:100%}
.card:hover{border-color:var(--line-2);box-shadow:var(--shadow)}
.card .tt{font-weight:600;line-height:1.3}
.card .sl{font-family:var(--mono);font-size:11px;color:var(--muted)}
.card .rw{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:12px;color:var(--ink-2)}
.card .rw .sp{margin-left:auto}
.card.stop{border-color:color-mix(in srgb,var(--crit) 55%,var(--line))}
.mini{font-size:12px;color:var(--ink-2);padding:6px 8px;border-radius:6px;background:var(--panel);border:1px solid var(--line);cursor:pointer;text-align:left;width:100%}
.mini:hover{border-color:var(--line-2)}

.goals{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.goal{padding:14px;display:flex;flex-direction:column;gap:8px;cursor:pointer;text-align:left}
.goal:hover{box-shadow:var(--shadow)}
.chain{display:flex;gap:3px;flex-wrap:wrap}
.resume{font-size:12.5px;background:var(--panel-2);border-radius:6px;padding:7px 9px;color:var(--ink-2)}

/* tables */
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{text-align:left;font-weight:600;color:var(--muted);font-size:12px;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap;cursor:default}
.tbl th.s{cursor:pointer}.tbl th.s:hover{color:var(--ink)}
.tbl td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl tr.c{cursor:pointer}.tbl tr.c:hover td{background:var(--panel-2)}
.tbl .r{text-align:right}
.tw{overflow-x:auto}

/* charts */
svg text{font-family:var(--sans)}
.ax{fill:var(--muted);font-size:11px}
.gl{stroke:var(--grid);stroke-width:1}
.bl{stroke:var(--line-2);stroke-width:1}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12.5px;color:var(--ink-2)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.hit{fill:transparent;cursor:crosshair}
.hit:hover{fill:color-mix(in srgb,var(--ink) 5%,transparent)}
.dq{display:flex;height:12px;border-radius:4px;overflow:hidden;gap:2px}
.hb{display:grid;grid-template-columns:110px minmax(0,1fr) 64px;gap:10px;align-items:center;font-size:13px;margin:6px 0}
.hb .tr{height:10px;background:var(--panel-2);border-radius:4px;overflow:hidden}
.hb .tr i{display:block;height:100%;border-radius:0 4px 4px 0}

/* graph canvases */
.split{display:grid;grid-template-columns:280px minmax(0,1fr);height:100%}
.split.r{grid-template-columns:minmax(0,1fr) 420px}
.side{border-right:1px solid var(--line);background:var(--panel);overflow:auto;padding:16px;display:flex;flex-direction:column;gap:18px;min-height:0}
.split.r .side{border-right:0;border-left:1px solid var(--line)}
.stage{position:relative;min-width:0;min-height:0;overflow:hidden;background-color:var(--bg);background-image:radial-gradient(var(--line-2) 1px,transparent 1.2px);background-size:22px 22px}
.vtop{position:absolute;left:14px;top:12px;right:14px;display:flex;gap:10px;align-items:center;z-index:2;pointer-events:none;flex-wrap:wrap}
.vtop>*{pointer-events:auto}
.ztools{position:absolute;right:14px;bottom:14px;display:flex;gap:4px;z-index:3;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:3px;box-shadow:var(--shadow)}
.ztools button{min-width:30px;height:28px;border-radius:6px;color:var(--ink-2);font-size:14px;padding:0 6px}
.ztools button:hover{background:var(--panel-2);color:var(--ink)}
.ztools .zl{font-size:11.5px;color:var(--muted);display:grid;place-items:center;min-width:42px}
svg.g{width:100%;height:100%;display:block;touch-action:none;cursor:grab}
svg.g.panning,.map.panning{cursor:grabbing}
.lk{stroke:var(--line-2);stroke-width:1.2;fill:none}
.lk.sup{stroke:var(--ink-2);stroke-dasharray:4 3;stroke-width:1.4}
.lk.broken{stroke:var(--crit);stroke-dasharray:3 3}
.arrow{fill:var(--ink-2)}
.nd{cursor:pointer}
.nd text{font-size:11px;fill:var(--ink-2);paint-order:stroke;stroke:var(--bg);stroke-width:3px;stroke-linejoin:round;pointer-events:none}
.nd .lbl{display:none}
svg.near .nd .lbl,.nd .lbl.always{display:block}
.nd.faded{opacity:.38}
svg.hl .nd:not(.on){opacity:.15}
svg.hl .lk:not(.on){opacity:.08}
svg.hl .lk.on{stroke:var(--accent);stroke-width:2}
.hub circle{fill:var(--panel);stroke:var(--line-2);stroke-width:1.5}
.ghost circle{fill:var(--bg);stroke:var(--crit);stroke-dasharray:3 2;stroke-width:1.5}
.sel circle,.sel rect,.sel path{stroke:var(--ink);stroke-width:2.5}

/* map (infinite canvas) */
.map{position:absolute;inset:0;overflow:hidden;touch-action:none;cursor:grab;background-color:var(--bg);background-image:radial-gradient(var(--line-2) 1px,transparent 1.2px);background-size:24px 24px}
.mworld{position:absolute;left:0;top:0;transform-origin:0 0}
.medges{position:absolute;left:0;top:0;width:1px;height:1px;overflow:visible;pointer-events:none}
.medges path{fill:none;stroke:var(--line-2);stroke-width:1.6}
.medges path.pend{stroke-dasharray:5 4}
.frame{position:absolute;border:1.5px dashed var(--line-2);border-radius:14px;background:color-mix(in srgb,var(--panel) 45%,transparent)}
.frame .ft{position:absolute;left:14px;top:-13px;background:var(--bg);padding:0 8px;font-weight:650;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2);transform-origin:0 50%}
.mc{position:absolute;background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:9px 11px;box-shadow:0 1px 2px rgba(0,0,0,.05);cursor:pointer;font-size:12.5px;display:flex;flex-direction:column;gap:5px;user-select:none}
.mc .k{font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);display:flex;gap:6px;align-items:center}
.mc .tt{font-weight:600;font-size:13.5px;line-height:1.3}
.mc .cb{color:var(--ink-2);line-height:1.4}
.map.hl .mc:not(.on){opacity:.18}
.map.hl .medges path:not(.on){opacity:.07}
.map.hl .medges path.on{stroke:var(--accent);stroke-width:2.5}
.mworld.far .mc .cb,.mworld.far .mc .k{visibility:hidden}
.mworld.far .frame .ft{transform:scale(2.4)}
.maphint{position:absolute;left:14px;bottom:14px;font-size:12px;color:var(--muted);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 10px;z-index:3}

/* drawer */
.scrim{position:fixed;inset:0;background:rgba(10,14,18,.28);z-index:40}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(560px,100%);background:var(--panel);border-left:1px solid var(--line);box-shadow:var(--shadow);z-index:41;display:flex;flex-direction:column;transform:translateX(0);transition:transform .18s ease}
@media (prefers-reduced-motion: reduce){.drawer{transition:none}}
.dh{padding:16px 18px 12px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:8px;padding-top:calc(16px + env(safe-area-inset-top,0px))}
.dh .x{position:absolute;right:12px;top:calc(12px + env(safe-area-inset-top,0px));width:30px;height:30px;border-radius:7px;color:var(--ink-2);font-size:18px}
.dh .x:hover{background:var(--panel-2)}
.dh .kind{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.dh h2{text-transform:none;letter-spacing:-.01em;font-size:18px;color:var(--ink);padding-right:36px}
.db{overflow:auto;padding:16px 18px 40px;display:flex;flex-direction:column;gap:16px;min-height:0}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin:0 -18px;padding:0 18px;overflow-x:auto}
.tabs button{padding:8px 10px;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs button.on{color:var(--ink);border-color:var(--accent);font-weight:600}
.kv{display:grid;grid-template-columns:120px minmax(0,1fr);gap:6px 12px;font-size:13px}
.kv dt{color:var(--muted)} .kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.stats div{background:var(--panel-2);border-radius:8px;padding:8px 10px}
.stats b{display:block;font-size:16px;font-variant-numeric:tabular-nums}
.stats span{font-size:11.5px;color:var(--muted)}

.stepper{display:flex;align-items:flex-start;gap:0;overflow-x:auto;padding-bottom:4px}
.st{display:flex;flex-direction:column;align-items:center;gap:4px;flex:1;min-width:58px;position:relative;font-size:10.5px;color:var(--muted);text-align:center}
.st::before{content:"";position:absolute;top:7px;left:-50%;right:50%;height:2px;background:var(--line-2)}
.st:first-child::before{display:none}
.st i{width:16px;height:16px;border-radius:50%;border:2px solid var(--line-2);background:var(--panel);z-index:1}
.st.done i{background:var(--accent);border-color:var(--accent)}
.st.done::before,.st.cur::before{background:var(--accent)}
.st.cur i{border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.st.cur{color:var(--ink);font-weight:600}

.day{font-size:11.5px;font-weight:650;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:6px 0 -6px}
.ent{border-left:2px solid var(--c);padding:2px 0 2px 12px;display:flex;flex-direction:column;gap:3px}
.ent.prog{border-left-style:dotted;opacity:.85}
.ent .eh{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:13px}
.ent .eh .tm{font-family:var(--mono);font-size:12px;color:var(--muted)}
.ent .eb{font-size:13px;color:var(--ink-2);display:grid;grid-template-columns:78px minmax(0,1fr);gap:1px 8px}
.ent .eb dt{color:var(--muted);font-size:12px}
.ent .eb dd{margin:0;overflow-wrap:anywhere}

.md{font-size:13.5px;line-height:1.6;color:var(--ink)}
.md h1{font-size:19px;margin:4px 0 8px}.md h2{font-size:14px;text-transform:none;letter-spacing:0;color:var(--ink);margin:16px 0 6px}

const RES={

function entriesFor(it){

function inline(s){return esc(s).replace(/`([^`]+)`/g,"<code>$1</code>").replace(/\*\*([^*]+)\*\*/g,"<b>$1</b>").replace(/\[\[([a-z0-9-]+)\]\]/g,(m,id)=>`<span class="wl${WBY.has(id)?"":" broken"}" data-wiki="${id}" data-tip="${WBY.has(id)?esc(WBY.get(id).title):"Broken link: no page named "+id}">${id}</span>`)}
function md(src){let out="",inCode=false,list=false;const lines=src.split("\n");let fm=null;
  if(lines[0]==="---"){const e=lines.indexOf("---",1);fm=lines.slice(1,e);lines.splice(0,e+1)}
  if(fm)out+=`<div class="fm">${fm.filter(Boolean).map(l=>`<span class="chip">${esc(l)}</span>`).join("")}</div>`;
  const close=()=>{if(list){out+="</ul>";list=false}};
  for(const l of lines){
    if(l.startsWith("```")){close();out+=inCode?"</code></pre>":"<pre><code>";inCode=!inCode;continue}
    if(inCode){out+=esc(l)+"\n";continue}
    const h=l.match(/^(#{1,3}) (.*)/);if(h){close();out+=`<h${h[1].length}>${inline(h[2])}</h${h[1].length}>`;continue}
    if(/^\s*- /.test(l)){if(!list){out+="<ul>";list=true}out+=`<li>${inline(l.replace(/^\s*- /,""))}</li>`;continue}
    if(!l.trim()){close();continue}
    close();out+=`<p>${inline(l)}</p>`}
  close();return `<div class="md">${out}</div>`}

function spark(vals,W=220,H=44){const mx=Math.max(...vals)*1.1||1,n=vals.length;const x=i=>2+i*(W-8)/(n-1),y=v=>H-3-(v/mx)*(H-8);
  const pts=vals.map((v,i)=>`${x(i).toFixed(1)},${y(v).toFixed(1)}`);
  return `<svg width="100%" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" style="height:${H}px;display:block"><path d="M${pts[0]} L${pts.join(" L")} L${x(n-1)},${H} L${x(0)},${H}Z" fill="var(--accent-soft)"/><path d="M${pts.join(" L")}" fill="none" stroke="var(--accent)" stroke-width="1.6" vector-effect="non-scaling-stroke"/><circle cx="${x(n-1)}" cy="${y(vals[n-1])}" r="3" fill="var(--accent)"/></svg>`}
function niceMax(v){const p=Math.pow(10,Math.floor(Math.log10(v||1)));for(const m of [1,2,2.5,5,10])if(m*p>=v)return m*p;return 10*p}
function daily(days){const out=[];for(let d=days-1;d>=0;d--){const day=new Date(+TODAY-d*DAY);const k=iso(day);
  const rows=ROWS.filter(r=>iso(r.ts)===k);const v={};COST_AGENTS.forEach(a=>v[a]=0);let est=0,none=0;
  rows.forEach(r=>{if(r.source==="measured")v[r.agent]+=r.cost_usd;else if(r.source==="estimated")est+=r.cost_usd;else none++});
  out.push({day,v,est,none,total:Object.values(v).reduce((a,b)=>a+b,0)})}return out}
function stacked(data,W){const H=260,pl=44,pr=8,pt=10,pb=26,n=data.length,iw=W-pl-pr,ih=H-pt-pb;
  const mx=niceMax(Math.max(...data.map(d=>d.total+d.est))*1.05),bw=iw/n,gap=Math.min(4,bw*.25);const y=v=>pt+ih-(v/mx)*ih;
  let s=`<svg width="${W}" height="${H}" role="img" aria-label="Spend per day stacked by worker"><defs><pattern id="hatch" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="5" height="5" fill="var(--panel)"/><line x1="0" y1="0" x2="0" y2="5" stroke="var(--muted)" stroke-width="1.6"/></pattern></defs>`;
  for(let i=0;i<=4;i++){const v=mx*i/4;s+=`<line class="gl" x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}"/><text class="ax" x="${pl-6}" y="${y(v)+4}" text-anchor="end">$${v%1?v.toFixed(1):v}</text>`}
  const every=n<=10?1:n<=31?7:14;
  data.forEach((d,i)=>{const x=pl+i*bw+gap/2,w=Math.max(1,bw-gap);let acc=0;
    COST_AGENTS.forEach(a=>{const v=d.v[a];if(v<=0)return;const y0=y(acc+v),h=y(acc)-y0;s+=`<rect x="${x}" y="${y0}" width="${w}" height="${Math.max(0,h-1)}" fill="${AG[a].c}"/>`;acc+=v});
    if(d.est>0){const y0=y(acc+d.est);s+=`<rect x="${x}" y="${y0}" width="${w}" height="${Math.max(0,y(acc)-y0-1)}" fill="url(#hatch)" stroke="var(--muted)" stroke-width=".6"/>`}
    if((n-1-i)%every===0)s+=`<text class="ax" x="${x+w/2}" y="${H-8}" text-anchor="middle">${dsh(d.day)}</text>`;
    const tipH=`<b>${dsh(d.day)} · ${usd(d.total)} measured</b><br>`+COST_AGENTS.filter(a=>d.v[a]>0).reverse().map(a=>`${AG[a].lat}: ${usd(d.v[a])}`).join("<br>")+(d.est?`<br><i>+ ${usd(d.est)} estimated (not trusted)</i>`:"")+(d.none?`<br><i>${d.none} row(s) unmeasured</i>`:"");
    s+=`<rect class="hit" x="${pl+i*bw}" y="${pt}" width="${bw}" height="${ih}" data-tip="${esc(tipH)}"/>`});
  s+=`<line class="bl" x1="${pl}" x2="${W-pr}" y1="${y(0)}" y2="${y(0)}"/></svg>`;return s}
function legendAgents(totals){return `<div class="legend">${COST_AGENTS.slice().reverse().map(a=>`<span><i style="background:${AG[a].c}"></i>${esc(AG[a][S.names==="bel"?"bel":"lat"])}${totals?` <span class="muted num">${usd(totals[a])}</span>`:""}</span>`).join("")}<span><i style="background:url(#hatch);border:1px solid var(--muted);background:repeating-linear-gradient(45deg,var(--muted) 0 1.5px,transparent 1.5px 4px)"></i>Estimated</span></div>`}

/* ============================================================ pan / zoom / drag / force */
function panZoom(el,world,o={}){const {svg=true,onZoom,label}=o;const t={x:0,y:0,k:1};
  const apply=()=>{if(svg)world.setAttribute("transform",`translate(${t.x} ${t.y}) scale(${t.k})`);else world.style.transform=`translate(${t.x}px,${t.y}px) scale(${t.k})`;onZoom&&onZoom(t);if(label)label.textContent=Math.round(t.k*100)+"%"};
  const zoomAt=(mx,my,k2)=>{k2=Math.max(.12,Math.min(4,k2));t.x=mx-(mx-t.x)*k2/t.k;t.y=my-(my-t.y)*k2/t.k;t.k=k2;apply()};
  el.addEventListener("wheel",e=>{e.preventDefault();const r=el.getBoundingClientRect();zoomAt(e.clientX-r.left,e.clientY-r.top,t.k*Math.exp(-e.deltaY*.0016))},{passive:false});
  let drag=null;
  el.addEventListener("pointerdown",e=>{if(e.button!==0)return;drag={x:e.clientX-t.x,y:e.clientY-t.y,id:e.pointerId};el.classList.add("panning")});
  el.addEventListener("pointermove",e=>{if(!drag)return;if(!el.hasPointerCapture(drag.id))try{el.setPointerCapture(drag.id)}catch(_){}t.x=e.clientX-drag.x;t.y=e.clientY-drag.y;apply()});
  const end=()=>{drag=null;el.classList.remove("panning")};el.addEventListener("pointerup",end);el.addEventListener("pointercancel",end);
  return {t,apply,zoomBy(f){const r=el.getBoundingClientRect();zoomAt(r.width/2,r.height/2,t.k*f)},
    fit(b,pad=48){const r=el.getBoundingClientRect();if(!r.width)return;const k=Math.min((r.width-pad*2)/Math.max(b.w,1),(r.height-pad*2)/Math.max(b.h,1),o.maxK||1);t.k=Math.max(.12,k);t.x=r.width/2-(b.x+b.w/2)*t.k;t.y=r.height/2-(b.y+b.h/2)*t.k;apply()},
    toWorld(cx,cy){const r=el.getBoundingClientRect();return{x:(cx-r.left-t.x)/t.k,y:(cy-r.top-t.y)/t.k}}}}
function draggable(el,pz,get,set,click){el.addEventListener("pointerdown",e=>{if(e.button!==0)return;e.stopPropagation();const p0=pz.toWorld(e.clientX,e.clientY),s=get();let moved=false;try{el.setPointerCapture(e.pointerId)}catch(_){}
  const mv=ev=>{const p=pz.toWorld(ev.clientX,ev.clientY);if(Math.abs(p.x-p0.x)+Math.abs(p.y-p0.y)>4/pz.t.k)moved=true;if(moved)set(s.x+p.x-p0.x,s.y+p.y-p0.y)};
  const up=()=>{el.removeEventListener("pointermove",mv);el.removeEventListener("pointerup",up);if(!moved&&click)click()};
  el.addEventListener("pointermove",mv);el.addEventListener("pointerup",up)})}
function forceLayout(nodes,links,o={}){const r=rng(o.seed||7),n=nodes.length,ix=new Map(nodes.map((d,i)=>[d.id,i]));
  nodes.forEach((d,i)=>{const a=i*2.399,rad=20+Math.sqrt(i)*30;d.x=Math.cos(a)*rad+r()*8;d.y=Math.sin(a)*rad+r()*8;d.vx=0;d.vy=0});
  const L=links.map(l=>[ix.get(l.s),ix.get(l.t),l.len||o.len||70]).filter(l=>l[0]!=null&&l[1]!=null);const it=o.iters||420,ch=o.charge||1100;
  for(let k=0;k<it;k++){const a=1-k/it;
    for(let i=0;i<n;i++)for(let j=i+1;j<n;j++){const A=nodes[i],B=nodes[j];let dx=B.x-A.x,dy=B.y-A.y,d2=dx*dx+dy*dy+.01;if(d2>160000)continue;const d=Math.sqrt(d2),f=ch/d2*a;dx/=d;dy/=d;A.vx-=dx*f;A.vy-=dy*f;B.vx+=dx*f;B.vy+=dy*f}
    for(const [i,j,len] of L){const A=nodes[i],B=nodes[j];const dx=B.x-A.x,dy=B.y-A.y,d=Math.sqrt(dx*dx+dy*dy)||1,f=(d-len)/d*.09*a;A.vx+=dx*f;A.vy+=dy*f;B.vx-=dx*f;B.vy-=dy*f}
    for(const d of nodes){d.vx-=d.x*.006*a;d.vy-=d.y*.006*a;d.x+=Math.max(-18,Math.min(18,d.vx));d.y+=Math.max(-18,Math.min(18,d.vy));d.vx*=.55;d.vy*=.55}}}
let GID=0;
function mountGraph(host,{nodes,links,draw,onClick,labelK=1.25,seed,len,charge}){
  forceLayout(nodes,links,{seed,len,charge});const uid=++GID;
  host.insertAdjacentHTML("beforeend",`<svg class="g" aria-label="Graph. Drag to pan, scroll to zoom."><defs><marker id="arr${uid}" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1L9,5L0,9z" class="arrow"/></marker></defs><g class="w"><g class="ls"></g><g class="ns"></g></g></svg><div class="ztools"><button data-z="out" aria-label="Zoom out">−</button><span class="zl">100%</span><button data-z="in" aria-label="Zoom in">+</button><button data-z="fit">Fit</button></div>`);
  const svg=host.querySelector("svg.g"),w=svg.querySelector(".w"),ls=svg.querySelector(".ls"),ns=svg.querySelector(".ns");
  const byId=new Map(nodes.map(n=>[n.id,n]));const L=links.filter(l=>byId.has(l.s)&&byId.has(l.t));
  ls.innerHTML=L.map(l=>`<line class="lk ${l.cls||""}"${l.arrow?` marker-end="url(#arr${uid})"`:""}/>`).join("");
  ns.innerHTML=nodes.map(n=>`<g class="nd ${n.cls||""}" data-id="${esc(n.id)}" tabindex="0" role="button" aria-label="${esc(n.label)}" data-tip="${esc(n.tip||n.label)}">${draw(n)}</g>`).join("");
  const lineEls=[...ls.children],nodeEls=new Map([...ns.children].map(e=>[e.dataset.id,e]));
  const adj=new Map();L.forEach(l=>{if(!adj.has(l.s))adj.set(l.s,new Set());if(!adj.has(l.t))adj.set(l.t,new Set());adj.get(l.s).add(l.t);adj.get(l.t).add(l.s)});
  function pos(){nodes.forEach(n=>nodeEls.get(n.id).setAttribute("transform",`translate(${n.x.toFixed(1)} ${n.y.toFixed(1)})`));
    L.forEach((l,i)=>{const a=byId.get(l.s),b=byId.get(l.t);let x2=b.x,y2=b.y;if(l.arrow){const dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy)||1,rr=(b.r||8)+3;x2=b.x-dx/d*rr;y2=b.y-dy/d*rr}
      const e=lineEls[i];e.setAttribute("x1",a.x);e.setAttribute("y1",a.y);e.setAttribute("x2",x2);e.setAttribute("y2",y2)})}
  pos();
  const pz=panZoom(svg,w,{onZoom:t=>svg.classList.toggle("near",t.k>=labelK),label:host.querySelector(".zl")});
  const hl=id=>{svg.classList.toggle("hl",!!id);nodeEls.forEach((el,k)=>el.classList.toggle("on",!!id&&(k===id||!!adj.get(id)?.has(k))));lineEls.forEach((el,i)=>el.classList.toggle("on",!!id&&(L[i].s===id||L[i].t===id)))};
  nodeEls.forEach((el,id)=>{const n=byId.get(id);draggable(el,pz,()=>({x:n.x,y:n.y}),(x,y)=>{n.x=x;n.y=y;pos()},()=>onClick(n));
    el.addEventListener("keydown",e=>{if(e.key==="Enter")onClick(n)});el.addEventListener("mouseenter",()=>hl(id));el.addEventListener("mouseleave",()=>hl(null));el.addEventListener("focus",()=>hl(id));el.addEventListener("blur",()=>hl(null))});
  const bbox=()=>{const xs=nodes.map(n=>n.x),ys=nodes.map(n=>n.y);const x=Math.min(...xs)-30,y=Math.min(...ys)-30;return{x,y,w:Math.max(...xs)-x+30,h:Math.max(...ys)-y+30}};
  host.querySelector(".ztools").addEventListener("click",e=>{const z=e.target.closest("[data-z]")?.dataset.z;if(z==="in")pz.zoomBy(1.25);if(z==="out")pz.zoomBy(.8);if(z==="fit")pz.fit(bbox())});
  requestAnimationFrame(()=>pz.fit(bbox()));
  return{pz,select(id){nodeEls.forEach((el,k)=>el.classList.toggle("sel",k===id))}}}

  if(e.rec&&e.rec.startsWith("STOP"))return `<span class="badge b-crit">■ STOP</span>`;if(e.status==="fail")return `<span class="badge b-crit">✗ FAIL</span>`;if(e.status==="pass")return `<span class="badge b-good">✓ PASS</span>`;return `<span class="badge b-info">${esc(e.status||"done")}</span>`}

function fcard(f){const l=lastE(f);const age=Math.round((TODAY-D(f.start))/DAY);

function goalCard(g){const st={open:["b-good","● running"],paused:["b-warn","⏸ paused"],done:["b-info","✓ done"]}[g.status];

function gantt(){
  const host=$("#wbody");const W=Math.max(640,host.clientWidth||900);const items=[...FEAT,...GOALS.filter(g=>g.status!=="done")];
  const t0=+D("2026-09-19"),t1=+TODAY+8*36e5,lw=Math.min(210,W*.3),pr=14,rh=40,H=items.length*rh+34;const x=t=>lw+(t-t0)/(t1-t0)*(W-lw-pr);
  let s=`<svg width="${W}" height="${H}" role="img" aria-label="Timeline of handoff entries per feature">`;
  for(let t=t0;t<=t1;t+=DAY){const d=new Date(t);const mon=d.getDay()===1;s+=`<line class="gl" x1="${x(t)}" x2="${x(t)}" y1="22" y2="${H}" ${mon?"":'opacity=".45"'}/>`;if(mon||d.getDate()===1)s+=`<text class="ax" x="${x(t)+3}" y="14">${dsh(d)}</text>`}
  s+=`<line x1="${x(+TODAY)}" x2="${x(+TODAY)}" y1="18" y2="${H}" stroke="var(--accent)" stroke-width="1.5"/><text x="${x(+TODAY)-4}" y="14" text-anchor="end" style="fill:var(--accent);font-size:11px;font-weight:600">Now</text>`;
  items.forEach((it,i)=>{const y=34+i*rh+rh/2-6,e=entriesFor(it);const a=x(+e[0].t),b=x(+e[e.length-1].t);
    s+=`<g ${oa("item",it.slug)} style="cursor:pointer"><text x="0" y="${y+4}" style="fill:var(--ink);font-size:12.5px;font-weight:600">${esc(it.title.length>26?it.title.slice(0,25)+"…":it.title)}</text><text x="0" y="${y+18}" class="ax">${it.goal?"goal · "+it.status:STAGES.find(s=>s.id===it.stage).label}</text></g>`;
    s+=`<line x1="${a}" x2="${b}" y1="${y}" y2="${y}" stroke="var(--line-2)" stroke-width="2"/>`;
    if(it.slug==="2026-10-02-club-invite-link"){const fa=e.filter(z=>z.ctx==="code QA"||z.ctx==="build");const ax=x(+fa[0].t);s+=`<rect x="${ax-6}" y="${y-12}" width="${b-ax+12}" height="24" rx="12" fill="color-mix(in srgb,var(--crit) 9%,transparent)" stroke="var(--crit)" stroke-dasharray="3 3" data-tip="Fix loop: 3 Cmok ↔ Bagnik cycles"/>`}
    e.forEach(z=>{const cx=x(+z.t),c=AG[akey(z.who)].c;const tp=`<b>${hm(z.t)} ${dsh(z.t)} · ${esc(aname(z.who))}</b> [${esc(z.ctx)}] ${esc(z.kind==="return"?z.status:z.kind)}<br>${esc(z.result)}${z.rec?`<br>Recommend: ${esc(z.rec)}`:""}`;
      if(z.rec&&z.rec.startsWith("STOP"))s+=`<rect x="${cx-6}" y="${y-6}" width="12" height="12" fill="var(--crit)" data-tip="${esc(tp)}" ${oa("item",it.slug)} style="cursor:pointer"/>`;
      else if(z.status==="fail")s+=`<g data-tip="${esc(tp)}" ${oa("item",it.slug)} style="cursor:pointer"><circle cx="${cx}" cy="${y}" r="7" fill="var(--panel)" stroke="var(--crit)" stroke-width="1.5"/><path d="M${cx-3},${y-3}L${cx+3},${y+3}M${cx+3},${y-3}L${cx-3},${y+3}" stroke="var(--crit)" stroke-width="1.8"/></g>`;
      else s+=`<circle cx="${cx}" cy="${y}" r="${z.kind==="return"?5.5:4}" fill="${z.kind==="return"?c:"var(--panel)"}" stroke="${c}" stroke-width="${z.kind==="return"?1.5:1.8}" stroke-opacity="1" style="cursor:pointer" data-tip="${esc(tp)}" ${oa("item",it.slug)}/>`})});
  s+=`</svg>`;
  host.innerHTML=`<section class="panel"><div class="ph"><div class="legend">${["skill","cmok","bagnik","mokash","zlydni","veles"].map(a=>`<span>${chip(a==="skill"?"skill:x":a,{sm:true,bare:true})} ${a==="skill"?"Skills":esc(AG[a][S.names==="bel"?"bel":"lat"])}</span>`).join("")}<span>● return · ○ progress · ✗ FAIL · <b style="color:var(--crit-ink)">■</b> STOP</span></div></div><div class="pb tw">${s}</div></section>`}

function costTable(rows){const items=ALL.map(it=>{const rs=rows.filter(r=>r.feature===it.slug);const m=rs.filter(r=>r.source==="measured");

  items.forEach(x=>x.per=x.cost/Math.max(1,x.iter));items.sort((a,b)=>costSort==="title"?a.it.title.localeCompare(b.it.title):b[costSort]-a[costSort]);

function memBody(){const st=$("#mstage");st.innerHTML="";const facts=FACTS.filter(f=>memGroups.has(GROUP(f.type)));
  if(memMode==="graph"){const ents=[...new Set(facts.flatMap(f=>f.entities))];

    const links=[...facts.flatMap(f=>f.entities.map(e=>({s:f.id,t:"e:"+e,len:46}))),...facts.filter(f=>f.supersedes&&memGroups.has(GROUP(FBY.get(f.supersedes).type))).map(f=>({s:f.id,t:f.supersedes,cls:"sup",arrow:true,len:60}))];
    mountGraph(st,{nodes,links,seed:3,charge:2400,len:58,labelK:1.6,draw:n=>{if(n.ent)return `<circle r="4"/><text class="lbl always" x="7" y="4">${esc(n.ent)}</text>`;const f=n.f,c=GCOL[GROUP(f.type)];

    st.insertAdjacentHTML("beforeend",`<div class="vtop"><span class="chip">Drag to pan · scroll to zoom · zoom in for labels</span></div>`)}

function memTimeline(st,facts){st.style.overflow="auto";st.style.backgroundImage="none";

  const P=new Map();groups.forEach((g,gi)=>{const y0=30+gi*lh;s+=`<text x="0" y="${y0+lh/2}" style="fill:var(--ink-2);font-size:12.5px;font-weight:600">${GLAB[g].split(",")[0]}</text><line class="bl" x1="${pl}" x2="${W-20}" y1="${y0+lh-6}" y2="${y0+lh-6}"/>`;

    fs.forEach(f=>{const cx=x(+D(f.decided));let lane=0;while(lanes[lane]!=null&&cx-lanes[lane]<16)lane++;lanes[lane]=cx;const cy=y0+lh-22-lane*20;P.set(f.id,{cx,cy})})});
  facts.filter(f=>f.supersedes&&P.has(f.supersedes)&&P.has(f.id)).forEach(f=>{const a=P.get(f.supersedes),b=P.get(f.id);const my=Math.min(a.cy,b.cy)-40;
    s+=`<path d="M${a.cx},${a.cy} C${a.cx},${my} ${b.cx},${my} ${b.cx},${b.cy-8}" fill="none" stroke="var(--ink-2)" stroke-dasharray="4 3" stroke-width="1.4" marker-end="url(#tlarr)"/><text class="ax" x="${(a.cx+b.cx)/2}" y="${my+8}" text-anchor="middle">replaced</text>`});
  s+=`<defs><marker id="tlarr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,1L9,5L0,9z" fill="var(--ink-2)"/></marker></defs>`;

  s+=`</svg>`;st.innerHTML=`<div class="pb"><section class="panel"><div class="ph"><h2>Decided when</h2><span class="r muted" style="font-size:12px">Dashed arrows: a newer fact replaced an older one</span></div><div class="pb tw">${s}</div></section></div>`}

function vResearch(){const acc=ROUNDS.filter(r=>r.accepted),rej=ROUNDS.filter(r=>!r.accepted);
  main.innerHTML=`<div class="wrap"><div class="head"><div><h1>AutoResearch</h1><p>Veles mutates an agent prompt, re-runs the eval set and keeps the change only if <span class="mono">composite = accuracy − 0.3·cost</span> does not drop.</p></div></div>

    <div class="panel kpi"><span class="l">Rejected</span><span class="v num">${rej.length}</span><span class="s">${rej.filter(r=>r.reason.startsWith("invariant")).length} invariant violation(s)</span></div>

  ${ROUNDS.slice().sort((a,b)=>b.ts-a.ts).slice(0,12).map(r=>`<tr class="c" ${oa("target",r.target)}><td class="num">${dsh(r.ts)}</td><td class="mono">${esc(r.target)}</td><td class="mono">${r.round}</td><td class="r num">${r.base.toFixed(3)}</td><td class="r num">${r.prop.toFixed(3)}</td><td class="r num">${r.delta>0?"+":""}${r.delta.toFixed(3)}</td><td>${r.accepted?'<span class="badge b-good">✓ accepted</span>':`<span class="badge b-crit">✗ ${r.reason.startsWith("invariant")?"invariant":"regressed"}</span>`}</td></tr>`).join("")}</tbody></table></div></section></div>`}
function smallMult(t){const rs=ROUNDS.filter(r=>r.target===t);const W=300,H=130,pl=34,pr=10,pt=10,pb=20;
  const vals=rs.flatMap(r=>[r.base,r.prop]);const lo=Math.floor((Math.min(...vals)-.01)*50)/50,hi=Math.ceil((Math.max(...vals)+.01)*50)/50;
  const x=i=>pl+i*(W-pl-pr)/Math.max(1,rs.length-1),y=v=>pt+(hi-v)/(hi-lo)*(H-pt-pb);
  let best=rs[0].base,path=`M${x(0)},${y(best)}`;rs.forEach((r,i)=>{if(r.accepted){path+=` L${x(i)},${y(best)} L${x(i)},${y(r.prop)}`;best=r.prop}});path+=` L${x(rs.length-1)},${y(best)}`;
  const gain=best-rs[0].base;const ag=t.endsWith("SKILL.md")?"skill:"+t.split("/")[0]:t.replace(".md","");
  let s=`<svg width="100%" viewBox="0 0 ${W} ${H}" role="img" aria-label="Composite per round for ${esc(t)}">`;
  [lo,(lo+hi)/2,hi].forEach(v=>{s+=`<line class="gl" x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}"/><text class="ax" x="${pl-5}" y="${y(v)+4}" text-anchor="end">${v.toFixed(2)}</text>`});
  s+=`<path d="${path}" fill="none" stroke="var(--ink-2)" stroke-width="2"/>`;
  rs.forEach((r,i)=>{const tp=`<b>${r.round} · ${dsh(r.ts)}</b><br>baseline ${r.base.toFixed(3)} → proposal ${r.prop.toFixed(3)}<br>${esc(r.reason)}`;
    s+=r.accepted?`<circle cx="${x(i)}" cy="${y(r.prop)}" r="4.5" fill="var(--good)" stroke="var(--panel)" stroke-width="1.5" data-tip="${esc(tp)}"/>`:`<g data-tip="${esc(tp)}"><circle cx="${x(i)}" cy="${y(r.prop)}" r="7" fill="transparent"/><path d="M${x(i)-3.5},${y(r.prop)-3.5}L${x(i)+3.5},${y(r.prop)+3.5}M${x(i)+3.5},${y(r.prop)-3.5}L${x(i)-3.5},${y(r.prop)+3.5}" stroke="var(--crit)" stroke-width="1.8"/></g>`});
  s+=`<text class="ax" x="${pl}" y="${H-4}">r1</text><text class="ax" x="${W-pr}" y="${H-4}" text-anchor="end">r${rs.length}</text></svg>`;
  return `<section class="panel" style="cursor:pointer" ${oa("target",t)}><div class="ph">${chip(ag,{sm:true,bare:true})}<span class="mono" style="font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(t)}</span><span class="r num" style="font-size:12.5px;color:${gain>0?"var(--good-ink)":"var(--muted)"}">${gain>0?"+":""}${gain.toFixed(3)}</span></div><div class="pb" style="padding:8px 10px">${s}<div class="muted num" style="font-size:12px">${rs.filter(r=>r.accepted).length} ✓ · ${rs.filter(r=>!r.accepted).length} ✗ · last ${dsh(rs[rs.length-1].ts)}</div></div></section>`}

    B.innerHTML=`<div class="stats"><div><b>${usd(rows.reduce((s,r)=>s+r.cost_usd,0))}</b><span>60-day spend</span></div><div><b>${rows.length}</b><span>runs measured</span></div><div><b>${tg.filter(r=>r.accepted).length}/${tg.length}</b><span>Veles rounds</span></div><div><b>${FACTS.filter(f=>f.hardened===id+".md").length}</b><span>hardened rules</span></div></div>
      ${FACTS.filter(f=>f.hardened===id+".md"||f.patch===id+".md").map(f=>`<div class="ent" style="--c:var(--accent);cursor:pointer" ${oa("fact",f.id)}><div class="eh">${f.hardened?'<span class="badge b-good">✓ hardened</span>':'<span class="badge b-warn">patch pending</span>'}<span class="mono muted">${f.id}</span></div><div style="font-size:13px">${esc(f.text)}</div></div>`).join("")}
      ${tg.length?`<div><h2 style="margin-bottom:8px">Ratchet</h2>${smallMult(id+".md")}</div>`:""}`;return}
  if(kind==="target"){const rs=ROUNDS.filter(r=>r.target===id);head("AutoResearch target",`<span class="mono" style="font-size:15px">${esc(id)}</span>`);
    B.innerHTML=smallMult(id)+`<div class="tw"><table class="tbl"><thead><tr><th>Round</th><th>When</th><th class="r">Base</th><th class="r">Prop.</th><th class="r">Acc.</th><th class="r">Cost</th><th>Verdict</th></tr></thead><tbody>${rs.slice().reverse().map(r=>`<tr><td class="mono">${r.round}</td><td class="num">${dsh(r.ts)}</td><td class="r num">${r.base.toFixed(3)}</td><td class="r num">${r.prop.toFixed(3)}</td><td class="r num">${r.accuracy.toFixed(2)}</td><td class="r num">${r.cost.toFixed(2)}</td><td>${r.accepted?'<span class="badge b-good">✓</span>':`<span class="badge b-crit" data-tip="${esc(r.reason)}">✗</span>`}</td></tr>`).join("")}</tbody></table></div>`;return}
}
function dItem(it,head,B,tab){const e=entriesFor(it);const path=(it.goal?"goals/":it.archived?"archive/":"features/")+it.slug;
  const idx=it.archived?STAGES.length:STAGES.findIndex(s=>s.id===it.stage);
  head(it.goal?"Goal · "+it.status:it.archived?"Archived feature":"Feature",esc(it.title),`<span class="mono muted">.tlk/${esc(path)}/</span><div style="display:flex;gap:6px;flex-wrap:wrap">${flagBadges(it)}</div>`+
    (it.goal?"":`<div class="stepper">${STAGES.map((s,i)=>`<div class="st ${i<idx?"done":i===idx?"cur":""}"><i></i>${s.label}</div>`).join("")}</div>`));
  const rows=ROWS.filter(r=>r.feature===it.slug);const by={};rows.filter(r=>r.source==="measured").forEach(r=>by[r.agent]=(by[r.agent]||0)+r.cost_usd);const bmax=Math.max(...Object.values(by),0.01);
  const tabs=[["timeline","Timeline"],...(it.goal?[["goal","Goal"]]:[["docs","Documents"]]),["cost","Cost"],...(it.deferred?[["deferred",`Deferred · ${it.deferred}`]]:[]),["memory","Memory"]];
  const T={
    timeline:()=>{let last="";return e.slice().reverse().map(z=>{const d=dsh(z.t);const dh=d!==last?`<div class="day">${d}</div>`:"";last=d;
      return dh+`<div class="ent${z.kind==="progress"?" prog":""}" style="--c:${AG[akey(z.who)].c}"><div class="eh"><span class="tm">${hm(z.t)}</span>${chip(z.who,{sm:true})}${z.kind==="return"?'<span class="muted">→ Coordinator</span>':""}<span class="chip">${esc(z.ctx)}</span>${statusBadge(z)}</div>
        <dl class="eb"><dt>Result</dt><dd>${esc(z.result)}</dd>${z.art&&z.art!=="—"?`<dt>Artifacts</dt><dd class="mono">${esc(z.art)}</dd>`:""}${z.kind==="return"?`<dt>Recommend</dt><dd><b>${esc(z.rec)}</b></dd><dt>Why</dt><dd>${esc(z.why)}</dd>${z.blk&&z.blk!=="None"?`<dt>Blockers</dt><dd style="color:var(--crit-ink)">${esc(z.blk)}</dd>`:""}`:""}</dl></div>`}).join("")},
    docs:()=>`${["spec.md","ux-design.md","tech-plan.md"].slice(0,Math.min(3,idx+(it.archived?3:0))).map(f=>`<a class="chip link" ${oa("file",`.tlk/${path}/${f}`)}>${f}</a>`).join(" ")}${md(it.slug==="2026-10-02-club-invite-link"?SPEC:`# ${it.title}\n\nThe spec, UX design and tech plan render here when the tab opens. Large files load on demand, never truncated.`)}`,
    goal:()=>`<dl class="kv"><dt>Objective</dt><dd>${esc(it.title)}</dd><dt>Status</dt><dd>${it.status}</dd>${it.reason?`<dt>Paused because</dt><dd>${esc(it.reason)}</dd><dt>Resume point</dt><dd>${esc(it.resume)}</dd>`:""}${it.note?`<dt>Progress</dt><dd>${esc(it.note)}</dd>`:""}<dt>Techniques</dt><dd class="chain">${it.tech.map(w=>chip(w,{sm:true})).join(" ")}</dd></dl>${it.status==="paused"?cmdBox("/loop"):""}`,
    cost:()=>`<div class="stats"><div><b>${usd(it.cost)}</b><span>measured</span></div><div><b>${kfmt(it.tokens)}</b><span>tokens</span></div><div><b>${rows.length}</b><span>rows</span></div><div><b>${rows.filter(r=>r.source!=="measured").length}</b><span>not measured</span></div></div>
      ${Object.entries(by).sort((a,b)=>b[1]-a[1]).map(([a,v])=>`<div class="hb"><span>${chip(a,{sm:true})}</span><span class="tr"><i style="width:${v/bmax*100}%;background:${AG[a].c}"></i></span><span class="num" style="text-align:right">${usd(v)}</span></div>`).join("")}`,
    deferred:()=>md(fileText(`.tlk/${path}/deferred.md`)),
    memory:()=>{const fs=FACTS.filter(f=>f.source&&f.source.includes(it.slug));return fs.length?fs.map(f=>`<div class="ent" style="--c:${GCOL[GROUP(f.type)]};cursor:pointer" ${oa("fact",f.id)}><div class="eh"><span class="tm">${f.decided}</span><span class="chip">${f.type}</span>${f.supersededBy?'<span class="badge b-info">superseded</span>':""}</div><div style="font-size:13px">${esc(f.text)}</div></div>`).join(""):'<p class="muted">No curated facts came from this work yet.</p>'}};
  const cur=tab&&T[tab]?tab:"timeline";
  B.innerHTML=`<div class="stats"><div><b>${usd(it.cost)}</b><span>spend</span></div><div><b>${e.filter(z=>z.kind==="return").length}</b><span>returns</span></div><div><b>${dsh(D(it.start))}</b><span>started</span></div><div><b>${ago(e[e.length-1].t)}</b><span>last entry</span></div></div>
    <div class="tabs">${tabs.map(([k,l])=>`<button data-t="${k}" class="${k===cur?"on":""}">${l}</button>`).join("")}</div><div id="tb" style="display:flex;flex-direction:column;gap:12px"></div>`;
  const show=k=>{$$(".tabs button",B).forEach(b=>b.classList.toggle("on",b.dataset.t===k));$("#tb",B).innerHTML=T[k]()};
  $$(".tabs button",B).forEach(b=>b.onclick=()=>show(b.dataset.t));show(cur)}

/* ============================================================ command palette */
let pal=null;
const INDEX=[...FEAT.map(f=>({k:"Feature",t:f.title,s:f.slug,go:["item",f.slug]})),...ARCH.map(f=>({k:"Archived",t:f.title,s:f.slug,go:["item",f.slug]})),...GOALS.map(g=>({k:"Goal",t:g.title,s:g.slug,go:["item",g.slug]})),
  ...FACTS.map(f=>({k:"Memory",t:f.text,s:f.id+" "+f.entities.join(" "),go:["fact",f.id]})),...WIKI.map(w=>({k:"Wiki",t:w.title,s:w.id,go:["wiki",w.id]})),
  ...Object.keys(AG).filter(a=>a!=="skill"&&a!=="coordinator").map(a=>({k:"Agent",t:AG[a].lat+" · "+AG[a].bel,s:AG[a].role,go:["agent",a]})),...FILES.map(p=>({k:"File",t:p,s:"",go:["file",p]}))];
function openPal(){if(pal)return;pal=document.createElement("div");pal.innerHTML=`<div class="scrim" style="z-index:59"></div><div class="pal" role="dialog" aria-label="Search"><input id="palq" placeholder="Search features, goals, memory, wiki, agents, files" autocomplete="off"><div class="res"></div></div>`;
  document.body.append(pal);$(".scrim",pal).onclick=closePal;const q=$("#palq"),res=$(".res",pal);let sel=0,list=[];
  const draw=()=>{const v=q.value.trim().toLowerCase();list=(v?INDEX.filter(x=>(x.t+" "+x.s).toLowerCase().includes(v)):INDEX.filter(x=>x.k==="Feature"||x.k==="Goal")).slice(0,40);sel=Math.min(sel,Math.max(0,list.length-1));let g="";
    res.innerHTML=list.map((x,i)=>{const h=x.k!==g?`<div class="gh">${x.k}</div>`:"";g=x.k;return h+`<div class="it${i===sel?" on":""}" data-i="${i}"><span class="tx">${esc(x.t)}</span><span class="ty mono">${esc(x.s.split(" ")[0])}</span></div>`}).join("")||`<div class="gh">Nothing matches. Files are searched by path.</div>`;
    $$(".it",res).forEach(el=>el.onclick=()=>go(list[+el.dataset.i]))};
  const go=x=>{closePal();open(...x.go)};
  q.oninput=()=>{sel=0;draw()};q.onkeydown=e=>{if(e.key==="ArrowDown"){sel=Math.min(list.length-1,sel+1);draw();e.preventDefault()}if(e.key==="ArrowUp"){sel=Math.max(0,sel-1);draw();e.preventDefault()}if(e.key==="Enter"&&list[sel])go(list[sel])};
  draw();q.focus()}
function closePal(){if(pal){pal.remove();pal=null}}
$("#openSearch").onclick=openPal;

renderTop();route();
</script>
