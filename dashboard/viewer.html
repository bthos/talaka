<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Talaka Dashboard</title>
<!-- Shipped by the Talaka kit (dashboard/viewer.html). Copied next to the snapshot by
     dashboard/tools/snapshot.sh; edit the kit copy, not .tlk/dashboard/index.html.
     No external requests: every style, script and chart is in this file. -->
<style>
/* Layout: fixed left rail + top bar; each view is its own work area; one shared detail drawer slides in from the right.
   Mockup constraints mirror the real build: one file, no fonts or libraries to fetch, hand-made SVG. */
:root{
  --bg:#f3f5f6; --panel:#ffffff; --panel-2:#edf0f2; --ink:#11171b; --ink-2:#46515a; --muted:#727d87;
  --line:#dce1e5; --line-2:#c6ced4; --grid:#e7eaed;
  --accent:#0d6880; --accent-ink:#ffffff; --accent-soft:#d9ecf1;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#e87ba4; --s6:#4a3aa7; --s7:#e34948;
  --good:#0ca30c; --warn:#fab219; --serious:#ec835a; --crit:#d03b3b;
  --good-ink:#006300; --warn-ink:#875800; --crit-ink:#b02a2a;
  --shadow:0 1px 2px rgba(15,25,32,.06),0 10px 28px rgba(15,25,32,.10);
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,"SF Mono","Cascadia Mono","JetBrains Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0d1012; --panel:#15191c; --panel-2:#1c2125; --ink:#e8ecef; --ink-2:#b2bbc2; --muted:#86909a;
  --line:#252b30; --line-2:#353c42; --grid:#20262a;
  --accent:#5cb6d1; --accent-ink:#04212a; --accent-soft:#143440;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#9085e9; --s7:#e66767;
  --good-ink:#3fc33f; --warn-ink:#f2bf4a; --crit-ink:#f07b7b;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 32px rgba(0,0,0,.45); color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0d1012; --panel:#15191c; --panel-2:#1c2125; --ink:#e8ecef; --ink-2:#b2bbc2; --muted:#86909a;
  --line:#252b30; --line-2:#353c42; --grid:#20262a;
  --accent:#5cb6d1; --accent-ink:#04212a; --accent-soft:#143440;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#9085e9; --s7:#e66767;
  --good-ink:#3fc33f; --warn-ink:#f2bf4a; --crit-ink:#f07b7b;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 32px rgba(0,0,0,.45); color-scheme:dark;}

*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
img{max-width:100%}
body{background:var(--bg);color:var(--ink);font:14px/1.45 var(--sans);overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--mono);font-size:12.5px}
.muted{color:var(--muted)} .ink2{color:var(--ink-2)}
.num{font-variant-numeric:tabular-nums}

.app{display:grid;grid-template-columns:212px minmax(0,1fr);grid-template-rows:52px minmax(0,1fr);height:100%}
.rail{grid-row:1/3;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:14px 10px;gap:2px;min-height:0}
.brand{display:flex;align-items:center;gap:10px;padding:2px 8px 16px}
.brand svg{flex:none}
.brand b{font-size:15px;letter-spacing:.14em;text-transform:uppercase}
.brand small{display:block;color:var(--muted);font-size:11px;letter-spacing:.02em;margin-top:-2px}
.nav{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:7px;color:var(--ink-2);text-decoration:none;white-space:nowrap}
.nav:hover{background:var(--panel-2);color:var(--ink)}
.nav.on{background:var(--accent-soft);color:var(--ink);font-weight:600}
.nav svg{width:17px;height:17px;flex:none;stroke:currentColor;fill:none;stroke-width:1.6}
.nav .ct{margin-left:auto;font-size:11px;font-weight:600;background:var(--crit);color:#fff;border-radius:9px;padding:0 6px;line-height:17px}
.rail .foot{margin-top:auto;padding:10px;font-size:11.5px;color:var(--muted);border-top:1px solid var(--line)}

.top{display:flex;align-items:center;gap:10px;padding:0 16px;border-bottom:1px solid var(--line);background:var(--panel);min-width:0}
.search{display:flex;align-items:center;gap:8px;flex:1;max-width:460px;height:32px;padding:0 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--muted);min-width:0}
.search span{flex:1;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
kbd{font-family:var(--mono);font-size:11px;border:1px solid var(--line-2);border-bottom-width:2px;border-radius:4px;padding:0 5px;color:var(--ink-2)}
.tbtn{height:32px;padding:0 10px;border:1px solid var(--line);border-radius:8px;display:flex;align-items:center;gap:7px;color:var(--ink-2);white-space:nowrap}
.tbtn:hover{border-color:var(--line-2);color:var(--ink)}
.src .dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.src.live .dot{background:var(--good);box-shadow:0 0 0 0 var(--good);animation:pulse 1.8s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(12,163,12,.5)}70%{box-shadow:0 0 0 7px rgba(12,163,12,0)}100%{box-shadow:0 0 0 0 rgba(12,163,12,0)}}
@media (prefers-reduced-motion: reduce){.src.live .dot{animation:none}}
.spacer{flex:1}

.main{overflow:auto;min-width:0;min-height:0;position:relative}
.wrap{padding:22px 24px 48px;max-width:1440px}
.main.full{overflow:hidden}
h1{font-size:21px;font-weight:650;letter-spacing:-.01em;margin:0;text-wrap:balance}
h2{font-size:13px;font-weight:650;margin:0;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2)}
h3{font-size:15px;font-weight:650;margin:0}
.head{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap;margin-bottom:18px}
.head p{margin:2px 0 0;color:var(--muted)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;min-width:0}
.ph{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line)}
.ph .r{margin-left:auto;display:flex;gap:8px;align-items:center}
.pb{padding:14px}
.grid{display:grid;gap:14px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;padding:2px;background:var(--panel)}
.seg button{padding:4px 11px;border-radius:6px;color:var(--ink-2);font-size:13px}
.seg button.on{background:var(--accent);color:var(--accent-ink)}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;padding:1px 8px;border-radius:999px;border:1px solid var(--line);color:var(--ink-2);white-space:nowrap;background:var(--panel)}
.chip.link{cursor:pointer}.chip.link:hover{border-color:var(--accent);color:var(--ink)}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:650;padding:1px 7px;border-radius:5px;white-space:nowrap;letter-spacing:.01em}
.b-crit{background:color-mix(in srgb,var(--crit) 14%,transparent);color:var(--crit-ink)}
.b-warn{background:color-mix(in srgb,var(--warn) 22%,transparent);color:var(--warn-ink)}
.b-good{background:color-mix(in srgb,var(--good) 15%,transparent);color:var(--good-ink)}
.b-info{background:var(--panel-2);color:var(--ink-2)}

/* worker identity: monogram disc + name, same everywhere */
.ag{display:inline-flex;align-items:center;gap:6px;white-space:nowrap;font-size:13px}
.ag b{width:18px;height:18px;border-radius:50%;background:var(--c);color:#fff;font:700 10.5px/18px var(--sans);text-align:center;flex:none}
.ag.sm b{width:15px;height:15px;font-size:9px;line-height:15px}

/* KPI */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:14px}
.kpi{padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.kpi .l{font-size:12px;color:var(--muted);letter-spacing:.03em}
.kpi .v{font-size:26px;font-weight:650;letter-spacing:-.02em;line-height:1.1}
.kpi .s{font-size:12.5px;color:var(--ink-2)}
.meter{display:grid;grid-template-columns:24px 1fr 38px;align-items:center;gap:8px;font-size:12px}
.mbar{position:relative;height:8px;border-radius:4px;background:var(--panel-2);overflow:visible}
.mbar i{position:absolute;inset:0 auto 0 0;border-radius:4px;background:var(--accent)}
.mbar u{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink);border-radius:1px}

/* inbox */
.inbox{display:flex;flex-direction:column}
.ib{display:grid;grid-template-columns:28px minmax(0,1fr);gap:10px;padding:12px 14px;border-bottom:1px solid var(--line)}
.ib:last-child{border-bottom:0}
.ib .ic{width:26px;height:26px;border-radius:7px;display:grid;place-items:center;font-size:13px;font-weight:700}
.ib .t{font-weight:600;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.ib .t a{color:inherit;text-decoration:none;cursor:pointer}.ib .t a:hover{text-decoration:underline}
.ib p{margin:3px 0 8px;color:var(--ink-2);font-size:13px}
.cmd{display:flex;align-items:center;gap:0;border:1px solid var(--line);border-radius:7px;background:var(--bg);max-width:100%;min-width:0}
.cmd code{font-family:var(--mono);font-size:12px;padding:5px 9px;overflow-x:auto;white-space:nowrap;flex:1;min-width:0}
.cmd button{border-left:1px solid var(--line);padding:5px 10px;font-size:12px;color:var(--ink-2);white-space:nowrap}
.cmd button:hover{color:var(--ink);background:var(--panel-2)}

/* feed */
.feed{display:flex;flex-direction:column}
.fe{display:grid;grid-template-columns:52px minmax(0,1fr);gap:10px;padding:9px 14px;border-bottom:1px solid var(--line);cursor:pointer}
.fe:hover{background:var(--panel-2)}
.fe:last-child{border-bottom:0}
.fe .tm{font-size:12px;color:var(--muted);padding-top:1px}
.fe .ln{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:13px}
.fe .rs{font-size:12.5px;color:var(--ink-2);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fe.prog .rs{color:var(--muted)}

/* board */
.board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(212px,1fr);gap:10px;overflow-x:auto;padding-bottom:6px}
.col{background:var(--panel-2);border-radius:10px;padding:8px;display:flex;flex-direction:column;gap:8px;min-height:180px}
.col h4{margin:2px 4px 2px;font-size:12px;font-weight:650;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-2);display:flex;gap:6px;align-items:center}
.col h4 .n{color:var(--muted);font-weight:500}
.col.arch{opacity:.92}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px;cursor:pointer;display:flex;flex-direction:column;gap:7px;text-align:left;width:100%}
.card:hover{border-color:var(--line-2);box-shadow:var(--shadow)}
.card .tt{font-weight:600;line-height:1.3}
.card .sl{font-family:var(--mono);font-size:11px;color:var(--muted)}
.card .rw{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:12px;color:var(--ink-2)}
.card .rw .sp{margin-left:auto}
.card.stop{border-color:color-mix(in srgb,var(--crit) 55%,var(--line))}
.mini{font-size:12px;color:var(--ink-2);padding:6px 8px;border-radius:6px;background:var(--panel);border:1px solid var(--line);cursor:pointer;text-align:left;width:100%}
.mini:hover{border-color:var(--line-2)}

.goals{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.goal{padding:14px;display:flex;flex-direction:column;gap:8px;cursor:pointer;text-align:left}
.goal:hover{box-shadow:var(--shadow)}
.chain{display:flex;gap:3px;flex-wrap:wrap}
.resume{font-size:12.5px;background:var(--panel-2);border-radius:6px;padding:7px 9px;color:var(--ink-2)}

/* tables */
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{text-align:left;font-weight:600;color:var(--muted);font-size:12px;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap;cursor:default}
.tbl th.s{cursor:pointer}.tbl th.s:hover{color:var(--ink)}
.tbl td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl tr.c{cursor:pointer}.tbl tr.c:hover td{background:var(--panel-2)}
.tbl .r{text-align:right}
.tw{overflow-x:auto}

/* charts */
svg text{font-family:var(--sans)}
.ax{fill:var(--muted);font-size:11px}
.gl{stroke:var(--grid);stroke-width:1}
.bl{stroke:var(--line-2);stroke-width:1}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12.5px;color:var(--ink-2)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.hit{fill:transparent;cursor:crosshair}
.hit:hover{fill:color-mix(in srgb,var(--ink) 5%,transparent)}
.dq{display:flex;height:12px;border-radius:4px;overflow:hidden;gap:2px}
.hb{display:grid;grid-template-columns:110px minmax(0,1fr) 64px;gap:10px;align-items:center;font-size:13px;margin:6px 0}
.hb .tr{height:10px;background:var(--panel-2);border-radius:4px;overflow:hidden}
.hb .tr i{display:block;height:100%;border-radius:0 4px 4px 0}

/* graph canvases */
.split{display:grid;grid-template-columns:280px minmax(0,1fr);height:100%}
.split.r{grid-template-columns:minmax(0,1fr) 420px}
.side{border-right:1px solid var(--line);background:var(--panel);overflow:auto;padding:16px;display:flex;flex-direction:column;gap:18px;min-height:0}
.split.r .side{border-right:0;border-left:1px solid var(--line)}
.stage{position:relative;min-width:0;min-height:0;overflow:hidden;background-color:var(--bg);background-image:radial-gradient(var(--line-2) 1px,transparent 1.2px);background-size:22px 22px}
.vtop{position:absolute;left:14px;top:12px;right:14px;display:flex;gap:10px;align-items:center;z-index:2;pointer-events:none;flex-wrap:wrap}
.vtop>*{pointer-events:auto}
.ztools{position:absolute;right:14px;bottom:14px;display:flex;gap:4px;z-index:3;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:3px;box-shadow:var(--shadow)}
.ztools button{min-width:30px;height:28px;border-radius:6px;color:var(--ink-2);font-size:14px;padding:0 6px}
.ztools button:hover{background:var(--panel-2);color:var(--ink)}
.ztools .zl{font-size:11.5px;color:var(--muted);display:grid;place-items:center;min-width:42px}
svg.g{width:100%;height:100%;display:block;touch-action:none;cursor:grab}
svg.g.panning,.map.panning{cursor:grabbing}
.lk{stroke:var(--line-2);stroke-width:1.2;fill:none}
.lk.sup{stroke:var(--ink-2);stroke-dasharray:4 3;stroke-width:1.4}
.lk.broken{stroke:var(--crit);stroke-dasharray:3 3}
.arrow{fill:var(--ink-2)}
.nd{cursor:pointer}
.nd text{font-size:11px;fill:var(--ink-2);paint-order:stroke;stroke:var(--bg);stroke-width:3px;stroke-linejoin:round;pointer-events:none}
.nd .lbl{display:none}
svg.near .nd .lbl,.nd .lbl.always{display:block}
.nd.faded{opacity:.38}
svg.hl .nd:not(.on){opacity:.15}
svg.hl .lk:not(.on){opacity:.08}
svg.hl .lk.on{stroke:var(--accent);stroke-width:2}
.hub circle{fill:var(--panel);stroke:var(--line-2);stroke-width:1.5}
.ghost circle{fill:var(--bg);stroke:var(--crit);stroke-dasharray:3 2;stroke-width:1.5}
.sel circle,.sel rect,.sel path{stroke:var(--ink);stroke-width:2.5}

/* map (infinite canvas) */
.map{position:absolute;inset:0;overflow:hidden;touch-action:none;cursor:grab;background-color:var(--bg);background-image:radial-gradient(var(--line-2) 1px,transparent 1.2px);background-size:24px 24px}
.mworld{position:absolute;left:0;top:0;transform-origin:0 0}
.medges{position:absolute;left:0;top:0;width:1px;height:1px;overflow:visible;pointer-events:none}
.medges path{fill:none;stroke:var(--line-2);stroke-width:1.6}
.medges path.pend{stroke-dasharray:5 4}
.frame{position:absolute;border:1.5px dashed var(--line-2);border-radius:14px;background:color-mix(in srgb,var(--panel) 45%,transparent)}
.frame .ft{position:absolute;left:14px;top:-13px;background:var(--bg);padding:0 8px;font-weight:650;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2);transform-origin:0 50%}
.mc{position:absolute;background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:9px 11px;box-shadow:0 1px 2px rgba(0,0,0,.05);cursor:pointer;font-size:12.5px;display:flex;flex-direction:column;gap:5px;user-select:none}
.mc .k{font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);display:flex;gap:6px;align-items:center}
.mc .tt{font-weight:600;font-size:13.5px;line-height:1.3}
.mc .cb{color:var(--ink-2);line-height:1.4}
.map.hl .mc:not(.on){opacity:.18}
.map.hl .medges path:not(.on){opacity:.07}
.map.hl .medges path.on{stroke:var(--accent);stroke-width:2.5}
.mworld.far .mc .cb,.mworld.far .mc .k{visibility:hidden}
.mworld.far .frame .ft{transform:scale(2.4)}
.maphint{position:absolute;left:14px;bottom:14px;font-size:12px;color:var(--muted);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 10px;z-index:3}

/* drawer */
.scrim{position:fixed;inset:0;background:rgba(10,14,18,.28);z-index:40}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(560px,100%);background:var(--panel);border-left:1px solid var(--line);box-shadow:var(--shadow);z-index:41;display:flex;flex-direction:column;transform:translateX(0);transition:transform .18s ease}
@media (prefers-reduced-motion: reduce){.drawer{transition:none}}
.dh{padding:16px 18px 12px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:8px;padding-top:calc(16px + env(safe-area-inset-top,0px))}
.dh .x{position:absolute;right:12px;top:calc(12px + env(safe-area-inset-top,0px));width:30px;height:30px;border-radius:7px;color:var(--ink-2);font-size:18px}
.dh .x:hover{background:var(--panel-2)}
.dh .kind{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.dh h2{text-transform:none;letter-spacing:-.01em;font-size:18px;color:var(--ink);padding-right:36px}
.db{overflow:auto;padding:16px 18px 40px;display:flex;flex-direction:column;gap:16px;min-height:0}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin:0 -18px;padding:0 18px;overflow-x:auto}
.tabs button{padding:8px 10px;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs button.on{color:var(--ink);border-color:var(--accent);font-weight:600}
.kv{display:grid;grid-template-columns:120px minmax(0,1fr);gap:6px 12px;font-size:13px}
.kv dt{color:var(--muted)} .kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.stats div{background:var(--panel-2);border-radius:8px;padding:8px 10px}
.stats b{display:block;font-size:16px;font-variant-numeric:tabular-nums}
.stats span{font-size:11.5px;color:var(--muted)}

.stepper{display:flex;align-items:flex-start;gap:0;overflow-x:auto;padding-bottom:4px}
.st{display:flex;flex-direction:column;align-items:center;gap:4px;flex:1;min-width:58px;position:relative;font-size:10.5px;color:var(--muted);text-align:center}
.st::before{content:"";position:absolute;top:7px;left:-50%;right:50%;height:2px;background:var(--line-2)}
.st:first-child::before{display:none}
.st i{width:16px;height:16px;border-radius:50%;border:2px solid var(--line-2);background:var(--panel);z-index:1}
.st.done i{background:var(--accent);border-color:var(--accent)}
.st.done::before,.st.cur::before{background:var(--accent)}
.st.cur i{border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.st.cur{color:var(--ink);font-weight:600}

.day{font-size:11.5px;font-weight:650;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:6px 0 -6px}
.ent{border-left:2px solid var(--c);padding:2px 0 2px 12px;display:flex;flex-direction:column;gap:3px}
.ent.prog{border-left-style:dotted;opacity:.85}
.ent .eh{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:13px}
.ent .eh .tm{font-family:var(--mono);font-size:12px;color:var(--muted)}
.ent .eb{font-size:13px;color:var(--ink-2);display:grid;grid-template-columns:78px minmax(0,1fr);gap:1px 8px}
.ent .eb dt{color:var(--muted);font-size:12px}
.ent .eb dd{margin:0;overflow-wrap:anywhere}

.md{font-size:13.5px;line-height:1.6;color:var(--ink)}
.md h1{font-size:19px;margin:4px 0 8px}.md h2{font-size:14px;text-transform:none;letter-spacing:0;color:var(--ink);margin:16px 0 6px}
.md h3{font-size:13.5px;margin:12px 0 4px}
.md p{margin:6px 0;max-width:68ch}.md ul{margin:6px 0;padding-left:20px}
.md code{font-family:var(--mono);font-size:12px;background:var(--panel-2);padding:1px 4px;border-radius:4px}
.md pre{background:var(--panel-2);padding:10px 12px;border-radius:8px;overflow-x:auto}
.md pre code{background:none;padding:0}
.md .wl{color:var(--accent);cursor:pointer;text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:2px}
.md .wl.broken{color:var(--crit-ink);text-decoration-style:dashed}
.fm{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px}
pre.raw{font-family:var(--mono);font-size:12px;line-height:1.55;white-space:pre-wrap;overflow-wrap:anywhere;margin:0;color:var(--ink)}

/* palette */
.pal{position:fixed;left:50%;top:12vh;transform:translateX(-50%);width:min(620px,calc(100% - 32px));background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);z-index:60;overflow:hidden}
.pal input{width:100%;border:0;border-bottom:1px solid var(--line);padding:14px 16px;font:15px var(--sans);background:transparent;color:var(--ink);outline:none}
.pal .res{max-height:52vh;overflow:auto;padding:6px}
.pal .gh{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);padding:8px 10px 4px}
.pal .it{display:flex;gap:10px;align-items:center;padding:7px 10px;border-radius:7px;cursor:pointer;min-width:0}
.pal .it.on,.pal .it:hover{background:var(--accent-soft)}
.pal .it .tx{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pal .it .ty{font-size:11.5px;color:var(--muted);white-space:nowrap}

/* files */
.tree{font-size:13px}
.tree details{margin-left:12px}.tree>details{margin-left:0}
.tree summary{cursor:pointer;padding:3px 4px;border-radius:5px;color:var(--ink-2);list-style:none;white-space:nowrap}
.tree summary::-webkit-details-marker{display:none}
.tree summary::before{content:"▸ ";color:var(--muted)}
.tree details[open]>summary::before{content:"▾ "}
.tree .f{display:block;width:100%;text-align:left;padding:3px 4px 3px 26px;border-radius:5px;font-family:var(--mono);font-size:12px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tree .f:hover{background:var(--panel-2)}.tree .f.on{background:var(--accent-soft);color:var(--ink)}

#tip{position:fixed;z-index:80;pointer-events:none;max-width:320px;background:var(--ink);color:var(--bg);font-size:12px;line-height:1.45;padding:7px 9px;border-radius:7px;box-shadow:var(--shadow)}
#tip i{opacity:.8}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:8px;font-size:13px;z-index:90}
.demo{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--warn-ink);border:1px solid color-mix(in srgb,var(--warn) 50%,transparent);border-radius:5px;padding:1px 6px}

@media (max-width:1100px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.goals{grid-template-columns:1fr}}
@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr);grid-template-rows:auto 48px minmax(0,1fr)}
  .rail{grid-row:auto;flex-direction:row;overflow-x:auto;padding:6px 10px;border-right:0;border-bottom:1px solid var(--line)}
  .brand,.rail .foot{display:none}
  .nav{padding:6px 9px}
  .wrap{padding:16px 16px 40px}
  .two{grid-template-columns:minmax(0,1fr)!important}
  .split,.split.r{grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(420px,1fr);height:auto;min-height:100%}
  .main.full{overflow:auto}
  .side{border-right:0;border-bottom:1px solid var(--line);max-height:none}
  .split.r .side{border-left:0;border-top:1px solid var(--line);order:2}
  .tbtn .lb{display:none}
  .search kbd{display:none}
  .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:520px){.kpis{grid-template-columns:minmax(0,1fr)}.hb{grid-template-columns:84px minmax(0,1fr) 56px}}

<body>
<div class="app">
  <nav class="rail" id="rail" aria-label="Sections"></nav>
  <header class="top">
    <button class="search" id="openSearch" aria-label="Search everything"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><span>Search features, memory, wiki, files…</span><kbd>Ctrl K</kbd></button>
    <span class="spacer"></span>
    <button class="tbtn newdata" id="newData" hidden data-tip="New data arrived. This view keeps its layout until you reload it.">New data · reload view</button>
    <button class="tbtn src" id="srcBtn"></button>
    <button class="tbtn" id="namesBtn" data-tip="Switch agent names between Latin and Belarusian"></button>
    <button class="tbtn" id="themeBtn" aria-label="Theme"></button>
  </header>
  <main class="main" id="main"></main>
</div>
<div id="tip" hidden></div>
<script>
"use strict";
/* Talaka dashboard. Read-only view over .tlk/ and wiki/.
   Data arrives one of two ways:
     snapshot  manifest.js + data/c<N>.js written next to this page by dashboard/tools/snapshot.sh
     live      the project folder itself, through the File System Access API (Chromium)
   Everything below parses the kit's own files; nothing is precomputed by the shell side. */

/* ============================================================ utilities */
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const DAY=864e5;
let NOW=new Date();
const D=s=>{const m=String(s||"").match(/^(\d{4})-(\d{2})-(\d{2})/);return m?new Date(+m[1],+m[2]-1,+m[3]):null};
const iso=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
const MON=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const WDAY=["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
const dsh=d=>d?`${d.getDate()} ${MON[d.getMonth()]}`:"—";
const hm=d=>`${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`;
const usd=v=>v==null||isNaN(v)?"—":"$"+(v>=100?v.toFixed(0):v.toFixed(2));
const kfmt=n=>n==null?"—":n>=1e6?(n/1e6).toFixed(1)+"M":n>=1e3?Math.round(n/1e3)+"k":String(Math.round(n));
const kb=n=>n>=1048576?(n/1048576).toFixed(1)+" MB":n>=1024?(n/1024).toFixed(1)+" KB":n+" B";
function ago(d){if(!d)return "—";const m=Math.round((NOW-d)/6e4);if(m<1)return "just now";if(m<60)return m+"m ago";const h=Math.round(m/60);if(h<36)return h+"h ago";return Math.round(h/24)+"d ago"}
const store={get(k,d){try{return localStorage.getItem("tlk-"+k)??d}catch(e){return d}},set(k,v){try{localStorage.setItem("tlk-"+k,v)}catch(e){}}};
const human=slug=>{const s=slug.replace(/^\d{4}-\d{2}-\d{2}-/,"").replace(/[-_]+/g," ").trim();return s?s[0].toUpperCase()+s.slice(1):slug};
async function pool(items,n,fn){let i=0;const run=async()=>{while(i<items.length){const k=i++;await fn(items[k],k)}};await Promise.all(Array.from({length:Math.min(n,items.length)},run))}

/* ============================================================ who */
const AG={
  coordinator:{lat:"Coordinator",bel:"Каардынатар",m:"◆",c:"var(--muted)",role:"Routes every step; never does the work itself"},
  skill:{lat:"Skills",bel:"Навыкі",m:"/",c:"var(--s1)",role:"Spec, UX, mockups, architecture, research, audits"},
  zlydni:{lat:"Zlydni",bel:"Злыдні",m:"Z",c:"var(--s2)",model:"Haiku",role:"Commits & version control",myth:"Little house spirits. They quietly do the unavoidable work."},
  bagnik:{lat:"Bagnik",bel:"Багнік",m:"B",c:"var(--s3)",model:"Opus",role:"Test gate & code QA",myth:"The swamp spirit at the bottom. Nothing slips past it."},
  veles:{lat:"Veles",bel:"Вялес",m:"V",c:"var(--s4)",model:"Sonnet",role:"AutoResearch ratchet",myth:"Master of Yav, Nav and Prav. Runs the ratchet loop across three worlds."},
  yaga:{lat:"Yaga",bel:"Яга",m:"Y",c:"var(--s5)",model:"Opus",role:"Debugging side loop",myth:"Baba Yaga sees what is hidden, but you answer her riddles first."},
  mokash:{lat:"Mokash",bel:"Мокаш",m:"M",c:"var(--s6)",model:"Sonnet",role:"Documentation",myth:"Goddess of spinning and record-keeping. She weaves the threads of knowledge."},
  cmok:{lat:"Cmok",bel:"Цмок",m:"C",c:"var(--s7)",model:"Sonnet",role:"Build",myth:"The Belarusian dragon: good-natured, fair, bestows treasure."},
};
const COST_AGENTS=["skill","zlydni","bagnik","veles","yaga","mokash","cmok"];
const AGENT_NAMES=["zlydni","bagnik","veles","yaga","mokash","cmok"];
const akey=w=>w.startsWith("skill:")?"skill":AG[w]?w:"skill";
const S={names:store.get("names","lat"),theme:store.get("theme","auto"),view:"today"};
function normWho(s){s=String(s||"").trim().replace(/^[@/]/,"").replace(/^\[|\]$/g,"").trim().toLowerCase();if(!s)return "coordinator";if(AG[s]&&s!=="skill")return s;
  for(const k of AGENT_NAMES)if(AG[k].bel.toLowerCase()===s)return k;return "skill:"+s.replace(/\s+/g,"-")}
const rowWho=a=>{a=String(a||"").toLowerCase();return AG[a]&&a!=="skill"&&a!=="coordinator"?a:"skill:"+a};
function aname(w){const k=akey(w);if(k==="skill")return "/"+(w.startsWith("skill:")?w.slice(6):w);return S.names==="bel"?AG[k].bel:AG[k].lat}
function chip(w,o={}){const k=akey(w),a=AG[k];const tip=k==="skill"?`Skill <b>/${esc(w.slice(6))}</b>`:`<b>${a.lat} · ${a.bel}</b><br>${a.role}${a.model?" · "+a.model:""}${a.myth?`<br><i>${a.myth}</i>`:""}`;
  return `<span class="ag${o.sm?" sm":""}" style="--c:${a.c}" data-tip="${esc(tip)}"><b>${a.m}</b>${o.bare?"":esc(aname(w))}</span>`}

const STAGES=[
  {id:"spec",label:"Spec"},{id:"ux",label:"UX"},{id:"mockups",label:"Mockups · UAT"},{id:"arch",label:"Architecture"},
  {id:"build",label:"Build"},{id:"qa",label:"Code QA"},{id:"ship",label:"Docs · commit"},
];
const CTX_STAGE={spec:"spec",ux:"ux",mockups:"mockups",uat:"mockups","arch + tests":"arch",arch:"arch",architecture:"arch","test gate":"arch",build:"build","code qa":"qa",qa:"qa",commit:"ship"};
const SKILL_STAGE={"requirements-eliciting":"spec","ux-designing":"ux","mockups-creating":"mockups","architecture-planning":"arch"};

/* ============================================================ data sources */
window.TLK={_m:null,_w:new Map(),manifest(m){TLK._m=m},chunk(p,t){const w=TLK._w.get(p);if(w){TLK._w.delete(p);w(t)}}};
function loadScript(src){return new Promise((res,rej)=>{const s=document.createElement("script");s.src=src;s.charset="utf-8";
  s.onload=()=>{s.remove();res()};s.onerror=()=>{s.remove();rej(new Error("could not load "+src))};document.head.append(s)})}
const ART_DIRS=["features","archive","goals","audits","maps","debug","memory","proposed-patches",".conflicts","autoresearch/runs"];
const ART_TOPS=["MEMORY.md","SESSION-STATE.md","usage.env","kit-issues.md","kit-issues-remote.tsv","PROJECT.md","PROJECT_PROFILE.md","autoresearch/program.md","autoresearch/tools/pricing.json"];
function isText(p){const b=p.split("/").pop();if(!b.includes("."))return true;
  return /\.(md|jsonl|json|env|tsv|txt|log|ya?ml|compact|cfg|csv|sh|html|css|js|ts|tsx|py|diff|patch|xml|svg|toml|ini)$/i.test(b)}

const Snap={kind:"snapshot",
  async list(){TLK._m=null;await loadScript("manifest.js?t="+Date.now());const m=TLK._m;if(!m||!Array.isArray(m.files))throw new Error("manifest.js is not a dashboard manifest");
    META={root:m.root,project:m.project,art:m.artefacts||".tlk",wiki:m.wiki||"wiki",kit:m.kit||"talaka",generated:m.generated};
    return m.files.map(([path,size,mtime,id])=>({path,size,mtime,id,text:id!=null}))},
  read(f){return new Promise((res,rej)=>{TLK._w.set(f.path,res);
    loadScript(`data/c${f.id}.js?v=${f.mtime}-${f.size}`).then(()=>{if(TLK._w.has(f.path)){TLK._w.delete(f.path);rej(new Error("chunk does not match the manifest; run the snapshot again"))}},e=>{TLK._w.delete(f.path);rej(e)})})}};

const Live={kind:"live",root:null,art:null,wiki:null,artName:".tlk",
  async attach(h){let art=null,wiki=null,artName=".tlk";
    try{art=await h.getDirectoryHandle(".tlk")}catch(e){}
    if(art){try{wiki=await h.getDirectoryHandle(META.wiki&&!META.wiki.includes("/")?META.wiki:"wiki")}catch(e){}}
    else{let ok=false;for(const d of ["features","memory","goals","archive"])try{await h.getDirectoryHandle(d);ok=true;break}catch(e){}
      if(!ok)throw new Error(`“${h.name}” has no .tlk/ folder. Pick the project root (the folder that contains .tlk/).`);art=h;artName=h.name}
    this.root=h;this.art=art;this.wiki=wiki;this.artName=artName;
    META={...META,root:META.root||null,project:art===h?"":h.name,art:artName,wiki:wiki?wiki.name:(META.wiki||"wiki"),generated:null}},
  async list(){const out=[];
    const walk=async(dir,prefix)=>{for await(const [name,h] of dir.entries()){if(name===".DS_Store"||name.startsWith(".start-")||name.includes(".tmp."))continue;
      if(h.kind==="directory")await walk(h,prefix+name+"/");else{const file=await h.getFile();out.push({path:prefix+name,size:file.size,mtime:Math.floor(file.lastModified/1000),handle:h,text:isText(name)})}}};
    const sub=async(base,rel)=>{let d=base;for(const part of rel.split("/")){d=await d.getDirectoryHandle(part)}return d};
    for(const d of ART_DIRS){try{await walk(await sub(this.art,d),`${this.artName}/${d}/`)}catch(e){}}
    for(const f of ART_TOPS){try{const parts=f.split("/");const dir=parts.length>1?await sub(this.art,parts.slice(0,-1).join("/")):this.art;const h=await dir.getFileHandle(parts.pop());const file=await h.getFile();
      out.push({path:`${this.artName}/${f}`,size:file.size,mtime:Math.floor(file.lastModified/1000),handle:h,text:true})}catch(e){}}
    if(this.wiki)await walk(this.wiki,this.wiki.name+"/");
    return out},
  async read(f){return (await f.handle.getFile()).text()}};

/* IndexedDB: the directory handle for Live mode, and a rebuildable text cache keyed by path + size + mtime. */
const IDB={db:undefined,
  async open(){if(this.db!==undefined)return this.db;try{this.db=await new Promise((res,rej)=>{const r=indexedDB.open("talaka-dashboard",1);
    r.onupgradeneeded=()=>{r.result.createObjectStore("text");r.result.createObjectStore("kv")};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}catch(e){this.db=null}return this.db},
  async get(store,keys){const db=await this.open();if(!db)return keys.map(()=>undefined);try{return await new Promise((res,rej)=>{const tx=db.transaction(store,"readonly"),os=tx.objectStore(store),out=new Array(keys.length);
    keys.forEach((k,i)=>{const r=os.get(k);r.onsuccess=()=>{out[i]=r.result}});tx.oncomplete=()=>res(out);tx.onerror=()=>rej(tx.error)})}catch(e){return keys.map(()=>undefined)}},
  async put(store,entries){const db=await this.open();if(!db||!entries.length)return;try{await new Promise((res,rej)=>{const tx=db.transaction(store,"readwrite"),os=tx.objectStore(store);
    entries.forEach(([k,v])=>os.put(v,k));tx.oncomplete=res;tx.onerror=()=>rej(tx.error)})}catch(e){}}};

let SRC=null,META={art:".tlk",wiki:"wiki",kit:"talaka"},FILES=new Map(),TEXT=new Map(),M=null,LIVE_HANDLE=null;
const sig=f=>f.size+":"+f.mtime;
const cacheKey=f=>(META.root||META.project||META.art)+"|"+f.path;
const txt=p=>{const t=TEXT.get(p);return t&&t.sig===sig(FILES.get(p)||{})?t.text:null};
function areaOf(path){const a=META.art+"/",w=META.wiki+"/";if(path.startsWith(a))return["A",path.slice(a.length)];if(path.startsWith(w))return["W",path.slice(w.length)];return["?",path]}
function isHot(f){if(!f.text)return false;const [ar,rel]=areaOf(f.path);if(ar==="W")return rel.endsWith(".md");if(ar!=="A")return false;
  if(/^(features|archive|goals|audits|maps|debug)\/.+\/(handoff-log\.md|deferred\.md|summary\.md|goal\.md|metrics\.jsonl|LESSONS\.md)$/.test(rel))return true;
  if(rel.startsWith("memory/"))return rel!=="memory/index.jsonl";
  return rel.startsWith("autoresearch/runs/")||rel.startsWith("proposed-patches/")||ART_TOPS.includes(rel)}
async function ensure(list,onProgress){
  const need=list.filter(f=>f&&f.text&&(TEXT.get(f.path)||{}).sig!==sig(f));if(!need.length)return 0;
  const cached=await IDB.get("text",need.map(cacheKey));const miss=[];
  need.forEach((f,i)=>{const c=cached[i];if(c&&c.sig===sig(f))TEXT.set(f.path,c);else miss.push(f)});
  let done=need.length-miss.length;onProgress&&onProgress(done,need.length);const put=[];
  await pool(miss,10,async f=>{try{const t=await SRC.read(f);const v={sig:sig(f),text:t};TEXT.set(f.path,v);put.push([cacheKey(f),v])}catch(e){TEXT.set(f.path,{sig:sig(f),text:null,err:String(e.message||e)})}
    done++;onProgress&&onProgress(done,need.length)});
  IDB.put("text",put);return need.length}

/* ============================================================ parsers */
function frontMatter(t){const m=t.match(/^---\r?\n([\s\S]*?)\r?\n---\r?\n?/);if(!m)return[{},t];const o={};m[1].split(/\r?\n/).forEach(l=>{const k=l.match(/^([\w-]+):\s*(.*)$/);if(k)o[k[1]]=k[2].trim()});return[o,t.slice(m[0].length)]}
function sections(t){const out={};let cur=null;for(const l of t.split(/\r?\n/)){const h=l.match(/^##\s+(.*)$/);if(h){cur=h[1].trim();out[cur]=[];continue}if(cur)out[cur].push(l)}return out}
const realLines=ls=>(ls||[]).map(l=>l.trim()).filter(l=>l&&!/^_.*_$/.test(l)&&!/^<!--/.test(l));

function parseHandoff(text,start,mtime){const out=[];let cur=null;
  for(const l of text.split(/\r?\n/)){
    const m=l.match(/^##\s+(?:(\d{4}-\d{2}-\d{2})[ T])?(\d{1,2}):(\d{2})\s+(.*)$/);
    if(m){cur={date:m[1]||null,h:+m[2],mi:+m[3],head:m[4].trim(),f:{}};out.push(cur);continue}
    if(!cur)continue;const k=l.match(/^\s*(Result|Artifacts|Recommend|Why|Blockers|Next|Hypothesis|Evidence|Build|Tests)\s*:\s*(.*)$/i);
    if(k)cur.f[k[1].toLowerCase()]=k[2].trim();else if(l.trim())cur.f.body=(cur.f.body?cur.f.body+"\n":"")+l}
  for(const e of out){const h=e.head;let rest="";

  return `<span class="wl${ok?"":" broken"}" data-wiki="${esc(id)}" data-tip="${ok?esc(M.wby.get(id).title):"Broken link: no page named "+esc(id)}">${esc(id)}</span>`}).replace(/\b(mem_[0-9a-f]{6,})\b/g,(m,id)=>M&&M.fby.has(id)?`<a class="lnk" data-open="fact|${id}">${id}</a>`:id)}
function md(src){let out="",inCode=false,list=false,table=false;const lines=src.replace(/\r\n/g,"\n").split("\n");
  if(lines[0]==="---"){const e=lines.indexOf("---",1);if(e>0){out+=`<div class="fm">${lines.slice(1,e).filter(Boolean).map(l=>`<span class="chip">${esc(l)}</span>`).join("")}</div>`;lines.splice(0,e+1)}}
  const close=()=>{if(list){out+="</ul>";list=false}if(table){out+="</tbody></table></div>";table=false}};
  for(const l of lines){
    if(/^```/.test(l)){close();out+=inCode?"</code></pre>":"<pre><code>";inCode=!inCode;continue}
    if(inCode){out+=esc(l)+"\n";continue}
    const h=l.match(/^(#{1,4}) (.*)/);if(h){close();const n=Math.min(3,h[1].length);out+=`<h${n}>${inline(h[2])}</h${n}>`;continue}
    if(/^\s*\|.*\|\s*$/.test(l)){if(/^\s*\|[\s:|-]+\|\s*$/.test(l))continue;const cells=l.trim().slice(1,-1).split("|").map(c=>`<td>${inline(c.trim())}</td>`).join("");if(!table){close();out+='<div class="tw"><table class="tbl"><tbody>';table=true}out+=`<tr>${cells}</tr>`;continue}
    if(/^\s*([-*]|\d+\.) /.test(l)){if(table)close();if(!list){out+="<ul>";list=true}out+=`<li>${inline(l.replace(/^\s*([-*]|\d+\.) /,""))}</li>`;continue}
    if(!l.trim()){close();continue}
    close();out+=`<p>${inline(l)}</p>`}
  close();if(inCode)out+="</code></pre>";return `<div class="md">${out}</div>`}

function spark(vals,W=220,H=44){if(vals.length<2)return "";const mx=Math.max(...vals)*1.1||1,n=vals.length;const x=i=>2+i*(W-8)/(n-1),y=v=>H-3-(v/mx)*(H-8);
  const pts=vals.map((v,i)=>`${x(i).toFixed(1)},${y(v).toFixed(1)}`);
  return `<svg width="100%" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" style="height:${H}px;display:block"><path d="M${pts[0]} L${pts.join(" L")} L${x(n-1)},${H} L${x(0)},${H}Z" fill="var(--accent-soft)"/><path d="M${pts.join(" L")}" fill="none" stroke="var(--accent)" stroke-width="1.6" vector-effect="non-scaling-stroke"/><circle cx="${x(n-1)}" cy="${y(vals[n-1])}" r="3" fill="var(--accent)"/></svg>`}
function niceMax(v){if(!(v>0))return 1;const p=Math.pow(10,Math.floor(Math.log10(v)));for(const m of [1,2,2.5,5,10])if(m*p>=v)return m*p;return 10*p}
function daily(days){const today=new Date(NOW.getFullYear(),NOW.getMonth(),NOW.getDate());const byDay=new Map();
  for(const r of M.rows){const k=iso(r.ts);if(!byDay.has(k))byDay.set(k,[]);byDay.get(k).push(r)}
  const out=[];for(let d=days-1;d>=0;d--){const day=new Date(today.getFullYear(),today.getMonth(),today.getDate()-d);const rows=byDay.get(iso(day))||[];const v={};COST_AGENTS.forEach(a=>v[a]=0);let est=0,none=0;
    rows.forEach(r=>{if(r.source==="measured"&&r.cost!=null)v[akey(r.agent)]+=r.cost;else if(r.source==="estimated"&&r.cost!=null)est+=r.cost;else none++});
    out.push({day,v,est,none,total:Object.values(v).reduce((a,b)=>a+b,0)})}return out}
function stacked(data,W){const H=260,pl=48,pr=8,pt=10,pb=26,n=data.length,iw=W-pl-pr,ih=H-pt-pb;
  const mx=niceMax(Math.max(...data.map(d=>d.total+d.est))*1.05),bw=iw/n,gap=Math.min(4,bw*.25);const y=v=>pt+ih-(v/mx)*ih;
  let s=`<svg width="${W}" height="${H}" role="img" aria-label="Spend per day stacked by worker"><defs><pattern id="hatch" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="5" height="5" fill="var(--panel)"/><line x1="0" y1="0" x2="0" y2="5" stroke="var(--muted)" stroke-width="1.6"/></pattern></defs>`;
  for(let i=0;i<=4;i++){const v=mx*i/4;s+=`<line class="gl" x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}"/><text class="ax" x="${pl-6}" y="${y(v)+4}" text-anchor="end">$${+v.toFixed(2)}</text>`}
  const every=n<=10?1:n<=31?7:14;
  data.forEach((d,i)=>{const x=pl+i*bw+gap/2,w=Math.max(1,bw-gap);let acc=0;
    COST_AGENTS.forEach(a=>{const v=d.v[a];if(v<=0)return;const y0=y(acc+v),h=y(acc)-y0;s+=`<rect x="${x}" y="${y0}" width="${w}" height="${Math.max(0,h-1)}" fill="${AG[a].c}"/>`;acc+=v});
    if(d.est>0){const y0=y(acc+d.est);s+=`<rect x="${x}" y="${y0}" width="${w}" height="${Math.max(0,y(acc)-y0-1)}" fill="url(#hatch)" stroke="var(--muted)" stroke-width=".6"/>`}
    if((n-1-i)%every===0)s+=`<text class="ax" x="${x+w/2}" y="${H-8}" text-anchor="middle">${dsh(d.day)}</text>`;
    const tipH=`<b>${dsh(d.day)} · ${usd(d.total)} measured</b><br>`+COST_AGENTS.filter(a=>d.v[a]>0).reverse().map(a=>`${AG[a].lat}: ${usd(d.v[a])}`).join("<br>")+(d.est?`<br><i>+ ${usd(d.est)} estimated (not trusted)</i>`:"")+(d.none?`<br><i>${d.none} row(s) unmeasured</i>`:"");
    s+=`<rect class="hit" x="${pl+i*bw}" y="${pt}" width="${bw}" height="${ih}" data-tip="${esc(tipH)}"/>`});
  s+=`<line class="bl" x1="${pl}" x2="${W-pr}" y1="${y(0)}" y2="${y(0)}"/></svg>`;return s}
function legendAgents(totals){return `<div class="legend">${COST_AGENTS.slice().reverse().filter(a=>!totals||totals[a]>0).map(a=>`<span><i style="background:${AG[a].c}"></i>${esc(AG[a][S.names==="bel"?"bel":"lat"])}${totals?` <span class="muted num">${usd(totals[a])}</span>`:""}</span>`).join("")}<span><i style="background:repeating-linear-gradient(45deg,var(--muted) 0 1.5px,transparent 1.5px 4px);border:1px solid var(--muted)"></i>Estimated</span></div>`}

/* ============================================================ pan / zoom / drag / force */
function panZoom(el,world,o={}){const {svg=true,onZoom,label}=o;const t={x:0,y:0,k:1};
  const apply=()=>{if(svg)world.setAttribute("transform",`translate(${t.x} ${t.y}) scale(${t.k})`);else world.style.transform=`translate(${t.x}px,${t.y}px) scale(${t.k})`;onZoom&&onZoom(t);if(label)label.textContent=Math.round(t.k*100)+"%"};
  const zoomAt=(mx,my,k2)=>{k2=Math.max(.08,Math.min(4,k2));t.x=mx-(mx-t.x)*k2/t.k;t.y=my-(my-t.y)*k2/t.k;t.k=k2;apply()};
  el.addEventListener("wheel",e=>{e.preventDefault();const r=el.getBoundingClientRect();zoomAt(e.clientX-r.left,e.clientY-r.top,t.k*Math.exp(-e.deltaY*.0016))},{passive:false});
  let drag=null;
  el.addEventListener("pointerdown",e=>{if(e.button!==0)return;drag={x:e.clientX-t.x,y:e.clientY-t.y,id:e.pointerId};el.classList.add("panning")});
  el.addEventListener("pointermove",e=>{if(!drag)return;if(!el.hasPointerCapture(drag.id))try{el.setPointerCapture(drag.id)}catch(_){}t.x=e.clientX-drag.x;t.y=e.clientY-drag.y;apply()});
  const end=()=>{drag=null;el.classList.remove("panning")};el.addEventListener("pointerup",end);el.addEventListener("pointercancel",end);
  return {t,apply,zoomBy(f){const r=el.getBoundingClientRect();zoomAt(r.width/2,r.height/2,t.k*f)},
    fit(b,pad=48){const r=el.getBoundingClientRect();if(!r.width)return;const k=Math.min((r.width-pad*2)/Math.max(b.w,1),(r.height-pad*2)/Math.max(b.h,1),o.maxK||1);t.k=Math.max(.08,k);t.x=r.width/2-(b.x+b.w/2)*t.k;t.y=r.height/2-(b.y+b.h/2)*t.k;apply()},
    toWorld(cx,cy){const r=el.getBoundingClientRect();return{x:(cx-r.left-t.x)/t.k,y:(cy-r.top-t.y)/t.k}}}}
function draggable(el,pz,get,set,click){el.addEventListener("pointerdown",e=>{if(e.button!==0)return;e.stopPropagation();const p0=pz.toWorld(e.clientX,e.clientY),s=get();let moved=false;try{el.setPointerCapture(e.pointerId)}catch(_){}
  const mv=ev=>{const p=pz.toWorld(ev.clientX,ev.clientY);if(Math.abs(p.x-p0.x)+Math.abs(p.y-p0.y)>4/pz.t.k)moved=true;if(moved)set(s.x+p.x-p0.x,s.y+p.y-p0.y)};
  const up=()=>{el.removeEventListener("pointermove",mv);el.removeEventListener("pointerup",up);if(!moved&&click)click()};
  el.addEventListener("pointermove",mv);el.addEventListener("pointerup",up)})}
/* Force layout. Repulsion is O(n²) per tick, so the tick count shrinks as n grows: a 1,000-node graph still lays out in well under a second. */
function forceLayout(nodes,links,o={}){let a0=o.seed||7;const r=()=>{a0=(a0*16807)%2147483647;return a0/2147483647};const n=nodes.length,ix=new Map(nodes.map((d,i)=>[d.id,i]));
  nodes.forEach((d,i)=>{const a=i*2.399,rad=20+Math.sqrt(i)*30;d.x=Math.cos(a)*rad+r()*8;d.y=Math.sin(a)*rad+r()*8;d.vx=0;d.vy=0});
  const L=links.map(l=>[ix.get(l.s),ix.get(l.t),l.len||o.len||70]).filter(l=>l[0]!=null&&l[1]!=null);const it=Math.max(40,Math.min(o.iters||420,Math.floor(3e7/Math.max(1,n*n)))),ch=o.charge||1100;
  for(let k=0;k<it;k++){const a=1-k/it;
    for(let i=0;i<n;i++)for(let j=i+1;j<n;j++){const A=nodes[i],B=nodes[j];let dx=B.x-A.x,dy=B.y-A.y,d2=dx*dx+dy*dy+.01;if(d2>160000)continue;const d=Math.sqrt(d2),f=ch/d2*a;dx/=d;dy/=d;A.vx-=dx*f;A.vy-=dy*f;B.vx+=dx*f;B.vy+=dy*f}
    for(const [i,j,len] of L){const A=nodes[i],B=nodes[j];const dx=B.x-A.x,dy=B.y-A.y,d=Math.sqrt(dx*dx+dy*dy)||1,f=(d-len)/d*.09*a;A.vx+=dx*f;A.vy+=dy*f;B.vx-=dx*f;B.vy-=dy*f}
    for(const d of nodes){d.vx-=d.x*.006*a;d.vy-=d.y*.006*a;d.x+=Math.max(-18,Math.min(18,d.vx));d.y+=Math.max(-18,Math.min(18,d.vy));d.vx*=.55;d.vy*=.55}}}
let GID=0;
function mountGraph(host,{nodes,links,draw,onClick,labelK=1.25,seed,len,charge}){
  forceLayout(nodes,links,{seed,len,charge});const uid=++GID;
  host.insertAdjacentHTML("beforeend",`<svg class="g" aria-label="Graph. Drag to pan, scroll to zoom."><defs><marker id="arr${uid}" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1L9,5L0,9z" class="arrow"/></marker></defs><g class="w"><g class="ls"></g><g class="ns"></g></g></svg><div class="ztools"><button data-z="out" aria-label="Zoom out">−</button><span class="zl">100%</span><button data-z="in" aria-label="Zoom in">+</button><button data-z="fit">Fit</button></div>`);
  const svg=host.querySelector("svg.g"),w=svg.querySelector(".w"),ls=svg.querySelector(".ls"),ns=svg.querySelector(".ns");
  const byId=new Map(nodes.map(n=>[n.id,n]));const L=links.filter(l=>byId.has(l.s)&&byId.has(l.t));
  ls.innerHTML=L.map(l=>`<line class="lk ${l.cls||""}"${l.arrow?` marker-end="url(#arr${uid})"`:""}/>`).join("");
  ns.innerHTML=nodes.map(n=>`<g class="nd ${n.cls||""}" data-id="${esc(n.id)}" tabindex="0" role="button" aria-label="${esc(n.label)}" data-tip="${esc(n.tip||n.label)}">${draw(n)}</g>`).join("");
  const lineEls=[...ls.children],nodeEls=new Map([...ns.children].map(e=>[e.dataset.id,e]));
  const adj=new Map();L.forEach(l=>{if(!adj.has(l.s))adj.set(l.s,new Set());if(!adj.has(l.t))adj.set(l.t,new Set());adj.get(l.s).add(l.t);adj.get(l.t).add(l.s)});
  function pos(){nodes.forEach(n=>nodeEls.get(n.id).setAttribute("transform",`translate(${n.x.toFixed(1)} ${n.y.toFixed(1)})`));
    L.forEach((l,i)=>{const a=byId.get(l.s),b=byId.get(l.t);let x2=b.x,y2=b.y;if(l.arrow){const dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy)||1,rr=(b.r||8)+3;x2=b.x-dx/d*rr;y2=b.y-dy/d*rr}
      const e=lineEls[i];e.setAttribute("x1",a.x);e.setAttribute("y1",a.y);e.setAttribute("x2",x2);e.setAttribute("y2",y2)})}
  pos();
  const pz=panZoom(svg,w,{onZoom:t=>svg.classList.toggle("near",t.k>=labelK),label:host.querySelector(".zl")});
  const hl=id=>{svg.classList.toggle("hl",!!id);nodeEls.forEach((el,k)=>el.classList.toggle("on",!!id&&(k===id||!!adj.get(id)?.has(k))));lineEls.forEach((el,i)=>el.classList.toggle("on",!!id&&(L[i].s===id||L[i].t===id)))};
  nodeEls.forEach((el,id)=>{const n=byId.get(id);draggable(el,pz,()=>({x:n.x,y:n.y}),(x,y)=>{n.x=x;n.y=y;pos()},()=>onClick(n));
    el.addEventListener("keydown",e=>{if(e.key==="Enter")onClick(n)});el.addEventListener("mouseenter",()=>hl(id));el.addEventListener("mouseleave",()=>hl(null));el.addEventListener("focus",()=>hl(id));el.addEventListener("blur",()=>hl(null))});
  const bbox=()=>{const xs=nodes.map(n=>n.x),ys=nodes.map(n=>n.y);const x=Math.min(...xs)-30,y=Math.min(...ys)-30;return{x,y,w:Math.max(...xs)-x+30,h:Math.max(...ys)-y+30}};
  host.querySelector(".ztools").addEventListener("click",e=>{const z=e.target.closest("[data-z]")?.dataset.z;if(z==="in")pz.zoomBy(1.25);if(z==="out")pz.zoomBy(.8);if(z==="fit")pz.fit(bbox())});
  requestAnimationFrame(()=>pz.fit(bbox()));
  return{pz,select(id){nodeEls.forEach((el,k)=>el.classList.toggle("sel",k===id))}}}

function meter(l,w){if(!w)return `<div class="meter"><span class="muted">${l}</span><span class="muted" style="font-size:12px">no data</span><span></span></div>`;

function goalCard(g){const st={open:["b-good","● running"],paused:["b-warn","⏸ paused"],done:["b-info","✓ done"]}[g.status]||["b-info",g.status];const tech=g.entries.filter(e=>e.kind==="return").map(e=>e.who);

function gantt(){const host=$("#wbody");const items=[...M.features,...M.goals.filter(g=>g.status!=="done")].filter(i=>i.entries.length);
  if(!items.length){host.innerHTML=`<section class="panel">${empty("Nothing to plot","The timeline shows handoff entries of features and open goals.")}</section>`;return}
  const W=Math.max(640,host.clientWidth||900);const ts=items.flatMap(i=>i.entries.map(e=>+e.t));
  const t0=Math.min(...ts)-DAY/2,t1=Math.max(+NOW,Math.max(...ts))+DAY/4,lw=Math.min(210,W*.3),pr=14,rh=40,H=items.length*rh+34;const x=t=>lw+(t-t0)/(t1-t0)*(W-lw-pr);

  for(let d=new Date(new Date(t0).setHours(0,0,0,0));+d<=t1;d=new Date(d.getFullYear(),d.getMonth(),d.getDate()+1)){const mark=step===1?true:step===7?d.getDay()===1:d.getDate()===1||d.getDate()===15;

    if(it.loops>1){const fails=e.filter(z=>z.who==="bagnik"&&z.status==="fail");const ax=x(+fails[0].t)-30;s+=`<rect x="${Math.max(lw,ax)}" y="${y-12}" width="${Math.max(24,b-Math.max(lw,ax)+12)}" height="24" rx="12" fill="color-mix(in srgb,var(--crit) 9%,transparent)" stroke="var(--crit)" stroke-dasharray="3 3" data-tip="Fix loop: Bagnik failed ${it.loops} times"/>`}
    e.forEach(z=>{const cx=x(+z.t),c=AG[akey(z.who)].c;const tp=`<b>${hm(z.t)} ${dsh(z.t)}${z.approx?" (date inferred)":""} · ${esc(aname(z.who))}</b> [${esc(z.ctx)}] ${esc(z.kind==="return"?z.status:z.kind)}<br>${esc(z.result)}${z.rec?`<br>Recommend: ${esc(z.rec)}`:""}`;
      if(z.rec&&/^STOP\b/i.test(z.rec))s+=`<rect x="${cx-6}" y="${y-6}" width="12" height="12" fill="var(--crit)" data-tip="${esc(tp)}" ${oa("item",it.dir)} style="cursor:pointer"/>`;
      else if(z.status==="fail")s+=`<g data-tip="${esc(tp)}" ${oa("item",it.dir)} style="cursor:pointer"><circle cx="${cx}" cy="${y}" r="7" fill="var(--panel)" stroke="var(--crit)" stroke-width="1.5"/><path d="M${cx-3},${y-3}L${cx+3},${y+3}M${cx+3},${y-3}L${cx-3},${y+3}" stroke="var(--crit)" stroke-width="1.8"/></g>`;
      else s+=`<circle cx="${cx}" cy="${y}" r="${z.kind==="return"?5.5:4}" fill="${z.kind==="return"?c:"var(--panel)"}" stroke="${c}" stroke-width="${z.kind==="return"?1.5:1.8}" style="cursor:pointer" data-tip="${esc(tp)}" ${oa("item",it.dir)}/>`})});
  s+=`</svg>`;const present=[...new Set(items.flatMap(i=>i.entries.map(e=>akey(e.who))))];

function costTable(rows){const by=new Map();rows.forEach(r=>{const k=r.dir||"(no folder)";if(!by.has(k))by.set(k,[]);by.get(k).push(r)});
  const items=[...by.entries()].map(([dir,rs])=>{const it=M.byDir.get(dir);const m=rs.filter(r=>r.source==="measured"&&r.cost!=null);
    return{dir,it,title:it?it.title:dir==="(no folder)"?"Runs without a folder (evals)":dir,cost:m.reduce((s,r)=>s+r.cost,0),tokens:m.reduce((s,r)=>s+(r.tokens||0),0),wall:rs.reduce((s,r)=>s+(r.wall||0),0)/36e5,iter:it?it.entries.filter(e=>e.kind==="return").length:rs.length,unm:rs.length-m.length}});

  const tabs=[["timeline","Timeline"],...(it.goal?[["goal","Goal"]]:[]),["docs",`Files · ${docs.length}`],["cost","Cost"],...(it.deferredList.length?[["deferred",`Deferred · ${it.deferred}/${it.deferredList.length}`]]:[]),["memory",`Memory · ${facts.length}`]];
  const T={
    timeline:()=>{if(!e.length)return '<p class="muted">No handoff entries yet.</p>';let last="";return e.slice().reverse().map(z=>{const d=dsh(z.t);const dh=d!==last?`<div class="day">${d}${z.approx?' <span class="approx" data-tip="The log records only the time; the date is inferred from the file\'s modification time.">≈</span>':""}</div>`:"";last=d;
      return dh+`<div class="ent${z.kind==="progress"?" prog":""}" style="--c:${AG[akey(z.who)].c}"><div class="eh"><span${tAttr(z)}>${hm(z.t)}</span>${chip(z.who,{sm:true})}${z.kind==="return"?'<span class="muted">→ Coordinator</span>':""}${z.ctx?`<span class="chip">${esc(z.ctx)}</span>`:""}${statusBadge(z)}</div>
        <dl class="eb">${z.result?`<dt>Result</dt><dd>${esc(z.result)}</dd>`:""}${z.f.artifacts&&z.f.artifacts!=="—"?`<dt>Artifacts</dt><dd class="mono">${esc(z.f.artifacts)}</dd>`:""}${z.f.next?`<dt>Next</dt><dd>${esc(z.f.next)}</dd>`:""}${z.kind==="return"?`${z.rec?`<dt>Recommend</dt><dd><b>${esc(z.rec)}</b></dd>`:""}${z.f.why?`<dt>Why</dt><dd>${esc(z.f.why)}</dd>`:""}${z.blk&&!/^none\b/i.test(z.blk)?`<dt>Blockers</dt><dd style="color:var(--crit-ink)">${esc(z.blk)}</dd>`:""}`:""}</dl></div>`}).join("")},
    docs:()=>`<div style="display:flex;flex-wrap:wrap;gap:6px">${docs.map(n=>`<button class="chip link" data-doc="${esc(n)}">${esc(n)}</button>`).join("")||'<span class="muted">Only the log and metrics so far.</span>'}</div><div id="docv"></div>`,
    goal:()=>`<dl class="kv"><dt>Objective</dt><dd>${esc(it.title)}</dd><dt>Status</dt><dd>${esc(it.status)}</dd>${it.reason?`<dt>Stopped because</dt><dd>${esc(it.reason)}</dd>`:""}${it.resume?`<dt>Resume point</dt><dd>${esc(it.resume)}</dd>`:""}<dt>Iterations</dt><dd class="chain">${e.filter(z=>z.kind==="return").map(z=>chip(z.who,{sm:true,bare:true})).join("")||"—"}</dd></dl>${it.status==="paused"?cmdBox("/loop"):""}`,
    cost:()=>`<div class="stats"><div><b>${usd(it.cost)}</b><span>measured</span></div><div><b>${kfmt(it.tokens)}</b><span>tokens</span></div><div><b>${it.rows.length}</b><span>rows</span></div><div><b>${it.rows.filter(r=>r.source!=="measured").length}</b><span>not measured</span></div></div>
      ${Object.entries(by).sort((a,b)=>b[1]-a[1]).map(([a,v])=>`<div class="hb" style="grid-template-columns:150px minmax(0,1fr) 64px"><span>${chip(a,{sm:true})}</span><span class="tr"><i style="width:${v/bmax*100}%;background:${AG[akey(a)].c}"></i></span><span class="num" style="text-align:right">${usd(v)}</span></div>`).join("")||'<p class="muted">No measured rows.</p>'}`,
    deferred:()=>it.deferredList.map(d=>`<div class="ent" style="--c:${d.status==="open"?"var(--warn)":"var(--line-2)"}"><div class="eh"><span class="mono">${esc(d.id)}</span><b>${esc(d.title)}</b><span class="badge ${d.status==="open"?"b-warn":"b-info"}">${esc(d.status)}</span></div><dl class="eb">${Object.entries(d.f).filter(([k])=>k!=="status").map(([k,v])=>`<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join("")}</dl></div>`).join(""),
    memory:()=>facts.length?facts.map(f=>`<div class="ent" style="--c:${GCOL[GROUP(f.type)]};cursor:pointer" ${oa("fact",f.id)}><div class="eh"><span class="tm">${esc(f.decided)}</span><span class="chip">${esc(f.type)}</span>${f.supersededBy?'<span class="badge b-info">superseded</span>':""}</div><div style="font-size:13px">${esc(f.text)}</div></div>`).join(""):'<p class="muted">No curated facts name this folder as their source yet.</p>'};
  const cur=tab&&T[tab]?tab:"timeline";const lastT=e.length?e[e.length-1].t:it.lastT;
  B.innerHTML=`<div class="stats"><div><b>${usd(it.cost)}</b><span>spend</span></div><div><b>${e.filter(z=>z.kind==="return").length}</b><span>returns</span></div><div><b>${it.start?dsh(it.start):"—"}</b><span>started</span></div><div><b>${ago(lastT)}</b><span>last entry</span></div></div>
    <div class="tabs">${tabs.map(([k,l])=>`<button data-t="${k}" class="${k===cur?"on":""}">${l}</button>`).join("")}</div><div id="tb" style="display:flex;flex-direction:column;gap:12px"></div>`;
  const show=k=>{$$(".tabs button",B).forEach(b=>b.classList.toggle("on",b.dataset.t===k));$("#tb",B).innerHTML=T[k]();
    if(k==="docs"){const showDoc=async n=>{const f=it.files.get(n);const v=$("#docv",B);$$("[data-doc]",B).forEach(b=>b.classList.toggle("newdata",b.dataset.doc===n));if(!f.text){v.innerHTML='<p class="note">Binary file; open it from disk.</p>';return}
        v.innerHTML='<p class="note">Loading…</p>';await ensure([f]);const t=txt(f.path);if(!$("#docv",B))return;v.innerHTML=t==null?'<p class="note">Could not read this file.</p>':(/\.md$/.test(n)?md(t):`<pre class="raw">${esc(t)}</pre>`)};
      $$("[data-doc]",B).forEach(b=>b.onclick=()=>showDoc(b.dataset.doc));const first=docs.find(n=>/spec\.md$/.test(n))||docs.find(n=>/\.md$/.test(n));if(first)showDoc(first)}};
  $$(".tabs button",B).forEach(b=>b.onclick=()=>show(b.dataset.t));show(cur)}

/* ============================================================ command palette */
let pal=null;
function palIndex(){return[...M.features.map(f=>({k:"Feature",t:f.title,s:f.dir,go:["item",f.dir]})),...M.goals.map(g=>({k:"Goal",t:g.title,s:g.dir,go:["item",g.dir]})),...M.other.map(o=>({k:"Other work",t:o.title,s:o.dir,go:["item",o.dir]})),...M.archived.map(f=>({k:"Archived",t:f.title,s:f.dir,go:["item",f.dir]})),
  ...M.facts.map(f=>({k:"Memory",t:f.text,s:f.id+" "+f.entities.join(" "),go:["fact",f.id]})),...M.wiki.map(w=>({k:"Wiki",t:w.title,s:w.id,go:["wiki",w.id]})),
  ...AGENT_NAMES.map(a=>({k:"Agent",t:AG[a].lat+" · "+AG[a].bel,s:AG[a].role,go:["agent",a]})),...[...FILES.values()].map(f=>({k:"File",t:f.path,s:"",go:["file",f.path]}))]}
function openPal(){if(pal)return;pal=document.createElement("div");pal.innerHTML=`<div class="scrim" style="z-index:59"></div><div class="pal" role="dialog" aria-label="Search"><input id="palq" placeholder="Search features, goals, memory, wiki, agents, files" autocomplete="off"><div class="res"></div></div>`;
  document.body.append(pal);$(".scrim",pal).onclick=closePal;const q=$("#palq"),res=$(".res",pal);let sel=0,list=[];const INDEX=palIndex();
  const textHits=v=>{if(v.length<3)return[];const out=[];for(const [p,o] of TEXT){if(!o.text||out.length>=30)continue;const i=o.text.toLowerCase().indexOf(v);if(i<0)continue;const ls=o.text.lastIndexOf("\n",i)+1,le=o.text.indexOf("\n",i);out.push({k:"Text",t:p,line:o.text.slice(ls,le<0?undefined:le).trim().slice(0,160),go:["file",p]})}return out};
  const unloaded=()=>[...FILES.values()].filter(f=>f.text&&txt(f.path)==null);
  const draw=()=>{const v=q.value.trim().toLowerCase();list=(v?INDEX.filter(x=>(x.t+" "+x.s).toLowerCase().includes(v)).slice(0,40).concat(textHits(v)):INDEX.filter(x=>x.k==="Feature"||x.k==="Goal").slice(0,40));sel=Math.min(sel,Math.max(0,list.length-1));let g="";
    const un=unloaded();
    res.innerHTML=list.map((x,i)=>{const h=x.k!==g?`<div class="gh">${x.k==="Text"?"Inside files":x.k}</div>`:"";g=x.k;const hit=x.line?`<div class="hl2">${esc(x.line)}</div>`:"";return h+`<div class="it${i===sel?" on":""}" data-i="${i}"><span class="tx">${esc(x.t)}</span><span class="ty mono">${esc((x.s||"").split(" ")[0])}</span></div>${hit}`}).join("")||`<div class="gh">Nothing matches.</div>`;
    if(v.length>=3&&un.length)res.insertAdjacentHTML("beforeend",`<div class="gh">${un.length} file(s) not loaded yet</div><div class="it" id="loadAll"><span class="tx">Search inside every file (loads ${un.length} more, ${kb(un.reduce((s,f)=>s+f.size,0))})</span></div>`);
    $$(".it[data-i]",res).forEach(el=>el.onclick=()=>go(list[+el.dataset.i]));const la=$("#loadAll",res);if(la)la.onclick=async()=>{la.querySelector(".tx").textContent="Loading…";await ensure(unloaded(),(d,n)=>{la.querySelector(".tx").textContent=`Loading ${d}/${n}…`});draw()}};
  const go=x=>{closePal();open(...x.go)};
  q.oninput=()=>{sel=0;draw()};q.onkeydown=e=>{if(e.key==="ArrowDown"){sel=Math.min(list.length-1,sel+1);draw();e.preventDefault()}if(e.key==="ArrowUp"){sel=Math.max(0,sel-1);draw();e.preventDefault()}if(e.key==="Enter"&&list[sel])go(list[sel])};
  draw();q.focus()}
function closePal(){if(pal){pal.remove();pal=null}}
$("#openSearch").onclick=()=>{if(M)openPal()};

/* ============================================================ boot, refresh, live */
function loading(on,label){let el=$("#loading");if(!on){if(el)el.remove();return}if(!el){el=document.createElement("div");el.id="loading";el.className="loading";el.innerHTML='<span></span><div class="bar"><i></i></div>';document.body.append(el)}
  return(d,n)=>{el.querySelector("span").textContent=`${label} ${d}/${n}`;el.querySelector("i").style.width=(n?d/n*100:0)+"%"}}
async function loadFrom(list){FILES=new Map(list.map(f=>[f.path,f]));const prog=loading(true,"Reading");await ensure(list.filter(isHot),prog);loading(false);build()}
let timer=null,busy=false;
async function refresh(){if(busy||!SRC)return;busy=true;try{const list=await SRC.list();const next=new Map(list.map(f=>[f.path,f]));let changed=next.size!==FILES.size;
    if(!changed)for(const [p,f] of next){const o=FILES.get(p);if(!o||sig(o)!==sig(f)){changed=true;break}}
    if(SRC.kind==="snapshot"&&META.generated)renderTop();
    if(!changed)return;FILES=next;await ensure(list.filter(isHot));build();
    if(["memory","wiki","map"].includes(S.view)||drawer||pal){pendingData=true;renderTop();renderRail()}else{const y=main.scrollTop;route();main.scrollTop=y}}
  catch(e){}finally{busy=false}}
function schedule(){clearInterval(timer);timer=setInterval(refresh,SRC&&SRC.kind==="live"?5000:30000)}
function landing(msg){main.className="main";renderRail();
  const fsa="showDirectoryPicker" in window;
  main.innerHTML=`<div class="landing"><h1>No dashboard data next to this page</h1>
    <p>${msg?esc(msg)+" ":""}This page shows what Talaka keeps in <span class="mono">.tlk/</span> and <span class="mono">wiki/</span>. It needs a snapshot written next to it, or read access to the project folder.</p>
    <p>From the project root, write a snapshot and open it:</p>${cmdBox("bash talaka/dashboard/tools/snapshot.sh --open")}
    <p class="note">After that the memory Stop hook refreshes the snapshot when a session ends, and this page re-reads it every 30 seconds.</p>
    ${fsa?`<p>Or read the project folder directly. Chrome and Edge only; the page asks for read access once.</p><button class="btn" id="pickDir">Open project folder…</button>`:`<p class="note">Reading a folder directly needs Chrome or Edge.</p>`}</div>`;
  const b=$("#pickDir");if(b)b.onclick=()=>startLive()}
async function startLive(){if(!("showDirectoryPicker" in window)){toast("Live mode needs Chrome or Edge. The snapshot refreshes after every session.");return}
  try{let h=LIVE_HANDLE;if(!h){const st=await IDB.get("kv",["handle"]);h=st[0]}
    if(h&&(await h.queryPermission({mode:"read"}))!=="granted"&&(await h.requestPermission({mode:"read"}))!=="granted")h=null;
    if(!h)h=await showDirectoryPicker({id:"talaka-project",mode:"read"});
    await Live.attach(h);LIVE_HANDLE=h;IDB.put("kv",[["handle",h]]);SRC=Live;await loadFrom(await Live.list());store.set("live","1");schedule();route();toast("Live: reading "+META.art+"/ every 5 s")}
  catch(e){if(e&&e.name==="AbortError")return;toast(String(e.message||e))}}
async function stopLive(){store.set("live","0");try{SRC=Snap;await loadFrom(await Snap.list());schedule();route();toast("Back to the snapshot")}catch(e){SRC=null;M=null;landing("No snapshot found.")}}
async function boot(){renderTop();
  try{SRC=Snap;const list=await Snap.list();
    if(store.get("live","0")==="1"&&"showDirectoryPicker" in window){const st=await IDB.get("kv",["handle"]);const h=st[0];if(h&&(await h.queryPermission({mode:"read"}))==="granted"){try{await Live.attach(h);LIVE_HANDLE=h;SRC=Live;await loadFrom(await Live.list());schedule();route();return}catch(e){SRC=Snap}}}
    await loadFrom(list);schedule();route()}
  catch(e){SRC=null;
    if("showDirectoryPicker" in window){try{const st=await IDB.get("kv",["handle"]);const h=st[0];if(h&&(await h.queryPermission({mode:"read"}))==="granted"){await Live.attach(h);LIVE_HANDLE=h;SRC=Live;await loadFrom(await Live.list());schedule();route();return}}catch(_){}}
    landing()}}
boot();
</script>
